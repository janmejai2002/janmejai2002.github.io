name: Publish from Notion

# Polls Notion for articles you have marked Approved and opens a PR with the
# generated markdown. Runs in the cloud, so it does not care whether the
# laptop is on, and it costs nothing when there is no work.
#
# It deliberately opens a PR rather than pushing to main: the drafts still need
# artwork and a TL;DR, and a diff is the right place to notice that.
#
# Requires a repository secret NOTION_TOKEN (Settings → Secrets and variables →
# Actions). The same integration token sync-news.mjs uses locally.

on:
  schedule:
    # Every 30 minutes, offset off the hour so it is not competing with the
    # thundering herd of :00 cron jobs.
    - cron: '17,47 * * * *'
  workflow_dispatch:

concurrency:
  group: publish-from-notion
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        working-directory: site
        run: npm ci

      - name: Generate markdown for approved articles
        id: gen
        working-directory: site
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/publish-article.mjs

      - name: Check whether anything was written
        id: diff
        run: |
          if [ -n "$(git status --porcelain site/src/content/blog)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "slugs=$(git status --porcelain site/src/content/blog | awk '{print $2}' | xargs -n1 basename | sed 's/\.md$//' | paste -sd', ')" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # The build has to pass before a human is asked to look at it. check-build
      # catches broken raw HTML, missing alt text and hardcoded colour.
      - name: Build
        if: steps.diff.outputs.changed == 'true'
        working-directory: site
        run: npm run build

      - name: Open a pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: notion/approved-articles
          commit-message: "Add approved article(s) from Notion: ${{ steps.diff.outputs.slugs }}"
          title: "Publish from Notion: ${{ steps.diff.outputs.slugs }}"
          body: |
            Generated by `scripts/publish-article.mjs` from Article Production
            rows marked **Approved**. The build passed, including `check-build`.

            **Before merging, each new post still needs:**

            - [ ] Artwork — author `site/assets-src/art/<slug>.svg` per `docs/ARTWORK.md`,
                  run `npm run images`, then add `heroImage` / `heroImageDark` / `heroAlt`
            - [ ] An `Executive TL;DR` block, to match the other posts
            - [ ] A read-through — these were drafted by a routine

            Merging deploys to Pages. The deploy workflow then runs
            `close-loop.mjs`, which verifies each URL is live before writing
            `Published`, the `Post URL` and the `Publish Date` back to Notion.
          labels: content
