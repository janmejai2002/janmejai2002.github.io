name: Publish from Notion

# Polls Notion for articles that are ready and gets them onto the site. Runs in
# the cloud, so it does not care whether the laptop is on, and it costs nothing
# when there is no work.
#
# There are two destinations, and publish-article.mjs decides per article which
# one applies (see AUTO_TRACKS in that file):
#
#   * Unattended tracks — Talks, Case Studies, Basics. These routines pick their
#     own subject from a curated allowlist, check their own claims, and file a
#     finished draft. They are meant to run end to end with nobody in the loop,
#     so their articles are committed straight to main and deploy immediately.
#     Waiting on an approval that never comes is the failure here, not the
#     safeguard: a finished Talks piece sat at Draft Ready for days for exactly
#     that reason, and two Case Studies sat at Approved behind a throttled cron.
#
#   * Everything else — Technical, Business. These still open a pull request,
#     because the owner wants a read-through before they ship.
#
# The automated gates apply to BOTH paths and are the real safety net: title
# length, meta description, a mandatory Executive TL;DR, artwork rendering, and
# a full `npm run build` including check-build (raw HTML, missing alt text,
# hardcoded colour). A draft failing any of these is never published — it is
# moved to Needs Revision in Notion with the reason written onto the row.
#
# Requires a repository secret NOTION_TOKEN (Settings -> Secrets and variables
# -> Actions). The same integration token sync-news.mjs uses locally.

on:
  schedule:
    # Every 30 minutes, offset off the hour so it is not competing with the
    # thundering herd of :00 cron jobs.
    #
    # Treat this as best-effort, NOT as a 30-minute guarantee. GitHub
    # deprioritises scheduled workflows on low-activity repositories: the
    # observed cadence on this repo is roughly hourly at best, with real gaps of
    # five hours and more. That is tolerable now that publishing is idempotent
    # and unattended, but it is why the reactive trigger below matters.
    - cron: '17,47 * * * *'
    # A second entry on a different offset. Two independent schedules are
    # throttled independently, so a skipped slot on one is often covered by the
    # other. Cheap insurance: a run with no work exits in about fifteen seconds.
    - cron: '3,33 * * * *'
  workflow_dispatch:
  # Reactive trigger, and the one that should normally do the work. Anything
  # that finishes a draft can POST to
  #   https://api.github.com/repos/janmejai2002/janmejai2002.github.io/dispatches
  #   { "event_type": "notion-changed" }
  # and this runs within seconds instead of within an unpredictable hour or
  # more. The writer routines on the laptop do exactly this as their last step;
  # a Notion database automation on Draft Status can do it too. The polling
  # schedules stay as the fallback, so if the dispatch is ever removed or its
  # token expires nothing silently stops working -- it just gets slower.
  # See docs/PUBLISHING.md.
  repository_dispatch:
    types: [notion-changed]

concurrency:
  group: publish-from-notion
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # A push made with GITHUB_TOKEN does not trigger deploy.yml (GitHub blocks
  # workflow-from-workflow recursion), so the unattended commit below has to
  # dispatch the deploy itself — which needs this scope.
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        working-directory: site
        run: npm ci

      - name: Generate markdown for ready articles
        working-directory: site
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/publish-article.mjs

      # publish-article.mjs writes site/publish-manifest.json splitting what it
      # produced into `auto` and `reviewed`. Read it here rather than parsing
      # `git status`: the diff cannot tell an unattended article from one the
      # owner is still reviewing, and guessing is how a draft under review would
      # end up pushed to main.
      - name: Read the publish manifest
        id: manifest
        run: |
          set -euo pipefail
          if [ ! -f site/publish-manifest.json ]; then
            echo "auto_count=0" >> "$GITHUB_OUTPUT"
            echo "reviewed_count=0" >> "$GITHUB_OUTPUT"
            echo "No manifest — nothing to publish."
            exit 0
          fi
          AUTO=$(jq -r '.auto | length' site/publish-manifest.json)
          REVIEWED=$(jq -r '.reviewed | length' site/publish-manifest.json)
          echo "auto_count=$AUTO" >> "$GITHUB_OUTPUT"
          echo "reviewed_count=$REVIEWED" >> "$GITHUB_OUTPUT"
          echo "auto_slugs=$(jq -r '[.auto[].slug] | join(", ")' site/publish-manifest.json)" >> "$GITHUB_OUTPUT"
          echo "reviewed_slugs=$(jq -r '[.reviewed[].slug] | join(", ")' site/publish-manifest.json)" >> "$GITHUB_OUTPUT"
          jq . site/publish-manifest.json

      # Render artwork before building. The generator has already written an SVG
      # per post (routine-authored from the Notion page, or deterministic
      # fallback), and the frontmatter references the rendered webp — so the
      # build fails if this is skipped. --new-art-only leaves existing art and
      # the fixed assets alone: sharp output is not byte-stable across
      # environments, and re-encoding everything would churn the whole art
      # directory into the diff.
      - name: Render new artwork
        if: steps.manifest.outputs.auto_count != '0' || steps.manifest.outputs.reviewed_count != '0'
        working-directory: site
        run: node scripts/make-images.mjs --new-art-only

      # The gate for both paths. Nothing reaches main or a PR without this
      # passing — which matters far more now that three tracks publish with no
      # human in the loop.
      - name: Build
        if: steps.manifest.outputs.auto_count != '0' || steps.manifest.outputs.reviewed_count != '0'
        working-directory: site
        run: npm run build

      # Unattended tracks go straight to main. Only the files belonging to those
      # specific slugs are staged, by name, so a reviewed article sitting in the
      # same working tree cannot ride along by accident.
      - name: Commit unattended articles to main
        if: steps.manifest.outputs.auto_count != '0'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for slug in $(jq -r '.auto[].slug' site/publish-manifest.json); do
            git add --force -- \
              "site/src/content/blog/$slug.md" \
              "site/assets-src/art/$slug.svg" \
              "site/src/assets/art/$slug-light.webp" \
              "site/src/assets/art/$slug-dark.webp" 2>/dev/null || true
          done
          if git diff --cached --quiet; then
            echo "Nothing staged — already committed."
            exit 0
          fi
          git commit -m "Publish from Notion: ${{ steps.manifest.outputs.auto_slugs }}"
          # Rebase rather than force: a reviewed-article PR branch or a human
          # commit may have landed on main while this run was building.
          git pull --rebase origin main
          git push origin HEAD:main
          echo "pushed=1" >> "$GITHUB_OUTPUT"
        id: commit_unattended

      # A GITHUB_TOKEN push does not fire deploy.yml's `push` trigger, so an
      # unattended article would sit on main unpublished until the next human
      # push. Dispatch the deploy explicitly. sync-news.yml does the same thing
      # for the same reason.
      - name: Deploy the unattended articles
        if: steps.commit_unattended.outputs.pushed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "${{ github.repository }}" --ref main

      # Everything else waits for a read-through, exactly as before.
      - name: Open a pull request for reviewed articles
        if: steps.manifest.outputs.reviewed_count != '0'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: notion/approved-articles
          commit-message: "Add approved article(s) from Notion: ${{ steps.manifest.outputs.reviewed_slugs }}"
          title: "Publish from Notion: ${{ steps.manifest.outputs.reviewed_slugs }}"
          body: |
            Generated by `scripts/publish-article.mjs` from Article Production
            rows on a reviewed track. The build passed, including `check-build`.

            Articles on the unattended tracks — Talks, Case Studies, Basics —
            are not here; they commit straight to main. This PR is only for the
            tracks you asked to read before they ship.

            Each post arrives complete: the Executive TL;DR is enforced at
            generation (a draft without one is bounced back to Notion as
            Needs Revision), and artwork is generated — routine-authored SVG
            from the Notion page when present, deterministic fallback art
            otherwise. If a post shipped with fallback art, better artwork can
            replace it on `main` after the merge; see `docs/ARTWORK.md`.

            **Before merging:**

            - [ ] A read-through — these were drafted by a routine

            **Do not commit to this branch.** The poll regenerates it from
            Notion and will destroy anything added here.

            Merging deploys to Pages. The deploy workflow then runs
            `close-loop.mjs`, which verifies each URL is live before writing
            `Published`, the `Post URL` and the `Publish Date` back to Notion.
          labels: content

      # publish-article.mjs writes its own rejections onto the row it rejected.
      # This is for the steps it cannot see — artwork, the build, the commit,
      # the PR: if any of them failed, put the reason on the Notion rows that
      # were being published, so the stall shows up where the owner works and
      # not only as a red run. `failure()` fires when any earlier step failed.
      - name: Flag Notion if publishing failed after generation
        if: ${{ failure() && (steps.manifest.outputs.auto_count != '0' || steps.manifest.outputs.reviewed_count != '0') }}
        working-directory: site
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTIFY_TOPIC: ${{ secrets.NOTIFY_TOPIC }}
        run: node scripts/flag-pipeline-failure.mjs "artwork rendering, the site build, the commit to main, or the pull request"

      # Catch-all: a failure so early there is no manifest (bad NOTION_TOKEN,
      # the query step itself, a checkout problem) leaves nothing on any Notion
      # row. This always fires on failure so the owner still gets one push with
      # a link, instead of finding out from the site not updating.
      - name: Push a failure notification
        if: ${{ failure() }}
        working-directory: site
        env:
          NOTIFY_TOPIC: ${{ secrets.NOTIFY_TOPIC }}
        run: |
          node scripts/notify.mjs \
            "Publish from Notion failed" \
            "The publish-from-notion run failed. Open the run for the reason." \
            --url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
