<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
  <title>Self-Hosted Agent Control Plane Inside VPC vs Outbound Model Inference</title>
  <desc>A large rectangular VPC boundary on the left encloses three internal infrastructure blocks; an ochre outbound line pierces a gap in the right-hand VPC wall, carrying three attribution tick marks to an external cloud circle on the right.</desc>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="{{paper}}"/>
  <g stroke="{{border}}" stroke-width="1" opacity="0.55">
    <line x1="120" y1="200" x2="1480" y2="200"/>
    <line x1="120" y1="450" x2="1480" y2="450"/>
    <line x1="120" y1="700" x2="1480" y2="700"/>
    <line x1="500" y1="120" x2="500" y2="780"/>
    <line x1="960" y1="120" x2="960" y2="780" stroke-dasharray="6 6"/>
    <line x1="1340" y1="120" x2="1340" y2="780"/>
  </g>
  <path d="M 960 415 L 960 150 L 180 150 L 180 750 L 960 750 L 960 485" fill="none" stroke="{{ink}}" stroke-width="3"/>
  <g stroke="{{ink}}" stroke-width="2" fill="none">
    <rect x="260" y="230" width="220" height="130"/>
    <rect x="260" y="540" width="220" height="130"/>
    <rect x="600" y="385" width="240" height="130"/>
    <line x1="370" y1="360" x2="370" y2="540"/>
    <line x1="480" y1="295" x2="720" y2="295"/>
    <line x1="720" y1="295" x2="720" y2="385"/>
    <line x1="480" y1="605" x2="720" y2="605"/>
    <line x1="720" y1="605" x2="720" y2="515"/>
    <circle cx="1340" cy="450" r="85"/>
  </g>
  <g stroke="{{ochre}}" stroke-width="3.5" fill="none">
    <line x1="840" y1="450" x2="1255" y2="450"/>
    <line x1="1030" y1="425" x2="1030" y2="475"/>
    <line x1="1090" y1="425" x2="1090" y2="475"/>
    <line x1="1150" y1="425" x2="1150" y2="475"/>
    <rect x="938" y="420" width="44" height="60" stroke-dasharray="4 4"/>
  </g>
  <g fill="{{ochre}}">
    <circle cx="840" cy="450" r="6"/>
    <circle cx="1255" cy="450" r="6"/>
    <circle cx="1340" cy="450" r="8"/>
  </g>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.05"/>
</svg>
