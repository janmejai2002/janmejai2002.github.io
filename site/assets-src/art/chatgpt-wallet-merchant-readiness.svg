<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
  <title>Web Bot Auth and Forwarded Header Passing Merchant CDN and Fraud Gates</title>
  <desc>Two vertical security gates at x=560 and x=940 stand in front of a right-hand checkout block: the top ink path is blocked at the first CDN gate, the middle dashed ink path is blocked at the second Fraud gate, and the bottom ochre path carrying signature and Forwarded ticks passes cleanly into the checkout core.</desc>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="{{paper}}"/>
  <g stroke="{{border}}" stroke-width="1" opacity="0.55">
    <line x1="120" y1="230" x2="1480" y2="230"/>
    <line x1="120" y1="450" x2="1480" y2="450"/>
    <line x1="120" y1="670" x2="1480" y2="670"/>
    <line x1="300" y1="100" x2="300" y2="800"/>
    <line x1="1240" y1="100" x2="1240" y2="800"/>
  </g>
  <g stroke="{{ink}}" stroke-width="2.5" fill="none">
    <line x1="560" y1="110" x2="560" y2="635"/>
    <line x1="560" y1="705" x2="560" y2="790"/>
    <line x1="940" y1="110" x2="940" y2="635"/>
    <line x1="940" y1="705" x2="940" y2="790"/>
    <rect x="1200" y="170" width="240" height="560"/>
  </g>
  <g stroke="{{ink}}" stroke-width="2" fill="none">
    <line x1="160" y1="230" x2="560" y2="230"/>
    <line x1="548" y1="218" x2="572" y2="242"/>
    <line x1="572" y1="218" x2="548" y2="242"/>
    <line x1="160" y1="450" x2="940" y2="450" stroke-dasharray="7 5"/>
    <line x1="928" y1="438" x2="952" y2="462"/>
    <line x1="952" y1="438" x2="928" y2="462"/>
  </g>
  <g stroke="{{ochre}}" stroke-width="3.5" fill="none">
    <line x1="160" y1="670" x2="1320" y2="670"/>
    <line x1="360" y1="648" x2="360" y2="692"/>
    <line x1="410" y1="648" x2="410" y2="692"/>
    <line x1="460" y1="648" x2="460" y2="692"/>
    <line x1="650" y1="652" x2="650" y2="688"/>
    <line x1="685" y1="652" x2="685" y2="688"/>
    <line x1="720" y1="652" x2="720" y2="688"/>
    <line x1="755" y1="652" x2="755" y2="688"/>
    <line x1="790" y1="652" x2="790" y2="688"/>
    <line x1="825" y1="652" x2="825" y2="688"/>
    <line x1="860" y1="652" x2="860" y2="688"/>
    <rect x="538" y="648" width="44" height="44"/>
    <rect x="918" y="648" width="44" height="44"/>
  </g>
  <g fill="{{ochre}}">
    <circle cx="160" cy="670" r="6"/>
    <circle cx="560" cy="670" r="6"/>
    <circle cx="940" cy="670" r="6"/>
    <circle cx="1320" cy="670" r="8"/>
  </g>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.05"/>
</svg>
