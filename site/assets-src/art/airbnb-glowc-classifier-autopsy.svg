<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
  <title>Airbnb 30 RPM Self-Hosting Crossover</title>
  <desc>Minimalist geometric diagram contrasting a flat self-hosted GPU bar against a rising linear API vector passing a broken moss green SLA gate.</desc>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="{{paper}}"/>
  <path d="M120,100v680h1360M120,580h1360M420,100v680M980,100v680" fill="none" stroke="{{border}}" stroke-width="1"/>
  <line x1="120" y1="680" x2="1420" y2="160" stroke="{{ink}}" stroke-width="2" stroke-dasharray="10,8"/>
  <rect x="120" y="540" width="1300" height="40" fill="{{ink}}" fill-opacity="0.08" stroke="{{ink}}" stroke-width="2"/>
  <circle cx="420" cy="560" r="10" fill="{{moss}}"/>
  <line x1="980" y1="120" x2="980" y2="390" stroke="{{moss}}" stroke-width="3"/>
  <line x1="980" y1="450" x2="980" y2="760" stroke="{{moss}}" stroke-width="3"/>
  <rect x="955" y="405" width="50" height="30" fill="{{moss}}" fill-opacity="0.25" stroke="{{moss}}" stroke-width="2"/>
  <circle cx="1420" cy="160" r="8" fill="{{ink}}"/>
  <path d="M220,780v16M320,780v16M420,770v32M620,780v16M820,780v16M980,770v32M1200,780v16" stroke="{{border}}" stroke-width="1.5"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.05"/>
</svg>
