<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
  <title>Memory Bandwidth vs GPU Compute</title>
  <desc>Geometric diagram of moss Key-Value ticks saturating a memory bus while ninety percent of the compute grid sits empty beneath a broken Roofline curve.</desc>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="{{paper}}"/>
  <rect x="120" y="100" width="1360" height="700" fill="none" stroke="{{border}}" stroke-width="1"/>
  <path d="M120,720H1480M200,100V800M620,525H780M620,555H780M740,170H1420" stroke="{{ink}}" stroke-width="2"/>
  <rect x="240" y="420" width="380" height="240" fill="none" stroke="{{ink}}" stroke-width="1.5"/>
  <path d="M260,435V645M280,435V645M300,435V645M320,435V645M340,435V645M360,435V645M380,435V645M400,435V645M420,435V645M440,435V645M460,435V645M480,435V645M500,435V645M520,435V645M540,435V645M560,435V645M580,435V645M600,435V645M200,720L540,380" stroke="{{moss}}" stroke-width="3"/>
  <line x1="565" y1="345" x2="740" y2="170" stroke="{{ink}}" stroke-width="1.5" stroke-dasharray="8,8"/>
  <circle cx="540" cy="380" r="7" fill="{{moss}}"/>
  <circle cx="740" cy="170" r="6" fill="none" stroke="{{ink}}" stroke-width="2"/>
  <path d="M820,240H1380V660H820ZM820,282H1380M820,324H1380M820,366H1380M820,408H1380M820,450H1380M820,492H1380M820,534H1380M820,576H1380M820,618H1380M890,240V660M960,240V660M1030,240V660M1100,240V660M1170,240V660M1240,240V660M1310,240V660" fill="none" stroke="{{border}}" stroke-width="1"/>
  <rect x="820" y="618" width="560" height="42" fill="{{moss}}" opacity="0.85"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.055"/>
</svg>
