<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
  <title>Self-Hosted GPU Fixed Cost Step Function vs Managed API Linear Spend</title>
  <desc>A Cartesian chart comparing the high stepped fixed cost of self-hosted H100 clusters against the linear slope of managed API billing, intersecting at the 1B daily token break-even point marked in hanko red.</desc>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="{{paper}}"/>
  <g stroke="{{border}}" stroke-width="1" opacity="0.6">
    <line x1="200" y1="160" x2="1420" y2="160"/>
    <line x1="200" y1="300" x2="1420" y2="300"/>
    <line x1="200" y1="440" x2="1420" y2="440"/>
    <line x1="200" y1="580" x2="1420" y2="580"/>
    <line x1="200" y1="720" x2="1420" y2="720"/>
    <line x1="440" y1="120" x2="440" y2="740"/>
    <line x1="680" y1="120" x2="680" y2="740"/>
    <line x1="920" y1="120" x2="920" y2="740"/>
    <line x1="1160" y1="120" x2="1160" y2="740"/>
  </g>
  <g stroke="{{ink}}" stroke-width="2" fill="none">
    <line x1="200" y1="120" x2="200" y2="720"/>
    <line x1="200" y1="720" x2="1420" y2="720"/>
  </g>
  <g stroke="{{ink}}" stroke-width="2.5" fill="none">
    <line x1="200" y1="440" x2="905" y2="440"/>
    <line x1="920" y1="415" x2="920" y2="235" stroke-dasharray="5 5"/>
    <line x1="935" y1="220" x2="1420" y2="220"/>
  </g>
  <line x1="200" y1="720" x2="1420" y2="140" stroke="{{hanko}}" stroke-width="3"/>
  <g stroke="{{hanko}}" stroke-width="2" fill="none">
    <circle cx="1126" cy="280" r="24"/>
    <line x1="1126" y1="304" x2="1126" y2="720" stroke-dasharray="4 6"/>
  </g>
  <circle cx="1126" cy="280" r="5.5" fill="{{hanko}}"/>
  <circle cx="789" cy="440" r="5" fill="{{ink}}"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.055"/>
</svg>
