<svg viewBox="0 0 1600 900" width="1600" height="900" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Silent Recall Drop vs. Traceable Bounding Boxes</title>
  <desc>Minimal geometric diagram contrasting a PDF page with a silently omitted dashed row on the left against a verified bounding-box grid with a vermilion hanko seal on the right.</desc>
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="{{paper}}"/>
  <rect x="220" y="170" width="440" height="560" fill="none" stroke="{{border}}" stroke-width="3"/>
  <rect x="270" y="230" width="340" height="72" fill="{{ink}}"/>
  <rect x="270" y="340" width="340" height="72" fill="none" stroke="{{border}}" stroke-width="3" stroke-dasharray="12 8"/>
  <rect x="270" y="450" width="340" height="72" fill="{{ink}}"/>
  <rect x="270" y="560" width="220" height="72" fill="{{ink}}"/>
  <line x1="660" y1="450" x2="940" y2="450" stroke="{{ink}}" stroke-width="2.5"/>
  <rect x="940" y="170" width="440" height="560" fill="none" stroke="{{ink}}" stroke-width="4"/>
  <rect x="990" y="230" width="340" height="72" fill="none" stroke="{{ink}}" stroke-width="3"/>
  <rect x="1006" y="246" width="140" height="40" fill="{{ink}}"/>
  <rect x="1166" y="246" width="148" height="40" fill="{{ink}}"/>
  <rect x="990" y="340" width="340" height="72" fill="none" stroke="{{hanko}}" stroke-width="3.5"/>
  <rect x="1006" y="356" width="140" height="40" fill="{{hanko}}"/>
  <rect x="1166" y="356" width="148" height="40" fill="{{ink}}"/>
  <rect x="990" y="450" width="340" height="72" fill="none" stroke="{{ink}}" stroke-width="3"/>
  <rect x="1006" y="466" width="140" height="40" fill="{{ink}}"/>
  <rect x="1166" y="466" width="148" height="40" fill="{{ink}}"/>
  <rect x="990" y="560" width="220" height="72" fill="none" stroke="{{ink}}" stroke-width="3"/>
  <rect x="1260" y="560" width="70" height="70" fill="{{hanko}}"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.05"/>
</svg>
