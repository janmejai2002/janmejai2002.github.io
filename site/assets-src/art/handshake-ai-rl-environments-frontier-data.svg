<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
<title>RL Environment Goldilocks Filter and Rubric Gate</title>
<desc>Minimalist geometric blueprint depicting a multi-file workspace grid feeding a central Goldilocks filter band and a broken rubric gate marked with a cinnabar seal.</desc>
<defs>
<filter id="grain" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
</filter>
</defs>
<rect width="1600" height="900" fill="{{paper}}"/>
<rect x="100" y="100" width="1400" height="700" fill="none" stroke="{{border}}" stroke-width="1"/>
<rect x="200" y="250" width="280" height="400" fill="none" stroke="{{ink}}" stroke-width="2"/>
<line x1="200" y1="350" x2="480" y2="350" stroke="{{border}}" stroke-width="1"/>
<line x1="200" y1="450" x2="480" y2="450" stroke="{{border}}" stroke-width="1"/>
<line x1="200" y1="550" x2="480" y2="550" stroke="{{border}}" stroke-width="1"/>
<line x1="293" y1="250" x2="293" y2="650" stroke="{{border}}" stroke-width="1"/>
<line x1="386" y1="250" x2="386" y2="650" stroke="{{border}}" stroke-width="1"/>
<line x1="480" y1="380" x2="1080" y2="380" stroke="{{ink}}" stroke-width="2"/>
<line x1="480" y1="520" x2="1080" y2="520" stroke="{{ink}}" stroke-width="2"/>
<circle cx="780" cy="450" r="48" fill="{{paper}}" stroke="{{ink}}" stroke-width="2"/>
<circle cx="780" cy="450" r="14" fill="{{ink}}"/>
<rect x="1160" y="280" width="220" height="340" fill="none" stroke="{{ink}}" stroke-width="2"/>
<line x1="1080" y1="200" x2="1080" y2="350" stroke="{{hanko}}" stroke-width="3"/>
<line x1="1080" y1="455" x2="1080" y2="700" stroke="{{hanko}}" stroke-width="3"/>
<rect x="1058" y="382" width="44" height="44" fill="none" stroke="{{hanko}}" stroke-width="3"/>
<circle cx="1080" cy="404" r="7" fill="{{hanko}}"/>
<rect width="1600" height="900" filter="url(#grain)" opacity="0.05"/>
</svg>
