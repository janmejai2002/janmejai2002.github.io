<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
  <title>A closed loop beside a chain of steps that crosses a dashed line</title>
  <desc>On the left, a small ring with two arrowheads returns to itself. On the right, a row of open circles joined in a chain runs left to right, crosses a vertical dashed line, and the last two circles are filled solid red. The final link stops in mid-air and its circle sits below the line of the others.</desc>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
  </filter>
  <rect width="1600" height="900" fill="{{paper}}"/>
  <g>
    <circle cx="330" cy="450" r="96" fill="none" stroke="{{ink}}" stroke-width="5" opacity="0.55" stroke-dasharray="404 60" transform="rotate(-24 330 450)"/>
    <path d="M 372 358 l 30 8 l -22 21" fill="none" stroke="{{ink}}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
    <path d="M 288 542 l -30 -8 l 22 -21" fill="none" stroke="{{ink}}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
    <circle cx="330" cy="450" r="13" fill="{{ink}}" opacity="0.45"/>
  </g>
  <line x1="500" y1="250" x2="500" y2="650" stroke="{{border}}" stroke-width="2"/>
  <line x1="1255" y1="215" x2="1255" y2="685" stroke="{{ink}}" stroke-width="3" stroke-dasharray="12 12" opacity="0.42"/>
  <g>
    <line x1="686" y1="450" x2="764" y2="450" stroke="{{ink}}" stroke-width="5" stroke-linecap="round" opacity="0.34"/>
    <line x1="816" y1="450" x2="894" y2="450" stroke="{{ink}}" stroke-width="5" stroke-linecap="round" opacity="0.34"/>
    <line x1="946" y1="450" x2="1024" y2="450" stroke="{{ink}}" stroke-width="5" stroke-linecap="round" opacity="0.34"/>
    <line x1="1076" y1="450" x2="1154" y2="450" stroke="{{ink}}" stroke-width="5" stroke-linecap="round" opacity="0.34"/>
    <line x1="1206" y1="450" x2="1304" y2="450" stroke="{{ink}}" stroke-width="5" stroke-linecap="round" opacity="0.34"/>
    <line x1="1356" y1="450" x2="1404" y2="450" stroke="{{hanko}}" stroke-width="5" stroke-linecap="round"/>
    <circle cx="660" cy="450" r="21" fill="none" stroke="{{ink}}" stroke-width="5" opacity="0.55"/>
    <circle cx="790" cy="450" r="21" fill="none" stroke="{{ink}}" stroke-width="5" opacity="0.55"/>
    <circle cx="920" cy="450" r="21" fill="none" stroke="{{ink}}" stroke-width="5" opacity="0.55"/>
    <circle cx="1050" cy="450" r="21" fill="none" stroke="{{ink}}" stroke-width="5" opacity="0.55"/>
    <circle cx="1180" cy="450" r="21" fill="none" stroke="{{ink}}" stroke-width="5" opacity="0.55"/>
    <circle cx="1330" cy="450" r="21" fill="{{hanko}}"/>
    <circle cx="1470" cy="484" r="21" fill="{{hanko}}"/>
  </g>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.055"/>
</svg>
