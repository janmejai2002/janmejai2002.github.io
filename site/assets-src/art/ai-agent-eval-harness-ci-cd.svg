<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
  <title>Flaky Agent Trajectories Filtered by Deterministic CI Gates</title>
  <desc>Eight agent execution paths enter from left across a Cartesian grid; three rigid vertical verification gates block drifting arcs while aligned mizu trajectories pass through to completion.</desc>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="{{paper}}"/>
  <g stroke="{{border}}" stroke-width="1" opacity="0.55">
    <line x1="120" y1="150" x2="1480" y2="150"/>
    <line x1="120" y1="300" x2="1480" y2="300"/>
    <line x1="120" y1="450" x2="1480" y2="450"/>
    <line x1="120" y1="600" x2="1480" y2="600"/>
    <line x1="120" y1="750" x2="1480" y2="750"/>
    <line x1="200" y1="100" x2="200" y2="800"/>
    <line x1="1400" y1="100" x2="1400" y2="800"/>
  </g>
  <g stroke="{{ink}}" stroke-width="2" fill="none">
    <line x1="520" y1="110" x2="520" y2="415"/>
    <line x1="520" y1="485" x2="520" y2="790"/>
    <line x1="860" y1="110" x2="860" y2="420"/>
    <line x1="860" y1="480" x2="860" y2="790"/>
    <line x1="1180" y1="110" x2="1180" y2="430"/>
    <line x1="1180" y1="470" x2="1180" y2="790"/>
  </g>
  <g stroke="{{ink}}" stroke-width="1.2" opacity="0.45" fill="none">
    <path d="M160,450C280,430,390,260,520,220"/>
    <path d="M160,450C290,470,410,640,520,690"/>
    <path d="M160,450C340,440,620,390,860,310" stroke-dasharray="6,5"/>
    <path d="M160,450C340,460,640,510,860,610" stroke-dasharray="6,5"/>
    <path d="M160,450C450,445,890,440,1180,365"/>
  </g>
  <g fill="{{ink}}">
    <circle cx="520" cy="220" r="4.5"/>
    <circle cx="520" cy="690" r="4.5"/>
    <circle cx="860" cy="310" r="4.5"/>
    <circle cx="860" cy="610" r="4.5"/>
    <circle cx="1180" cy="365" r="4.5"/>
  </g>
  <g stroke="{{mizu}}" stroke-width="3" fill="none">
    <path d="M160,450C420,438,740,446,1420,442"/>
    <path d="M160,450C420,450,740,450,1420,450"/>
    <path d="M160,450C420,462,740,454,1420,458"/>
  </g>
  <g fill="{{mizu}}">
    <circle cx="160" cy="450" r="6"/>
    <circle cx="520" cy="450" r="5"/>
    <circle cx="860" cy="450" r="5"/>
    <circle cx="1180" cy="450" r="5"/>
    <circle cx="1420" cy="450" r="7"/>
  </g>
  <rect x="846" y="296" width="28" height="28" fill="none" stroke="{{mizu}}" stroke-width="1.5"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.055"/>
</svg>
