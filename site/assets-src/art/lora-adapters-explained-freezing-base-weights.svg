<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
  <title>LoRA Frozen Base Matrix and Thin Adapter Strips</title>
  <desc>Geometric diagram of a large frozen square weight grid paired with two thin plum low-rank strips merging into an output line.</desc>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="{{paper}}"/>
  <rect x="120" y="100" width="1360" height="700" fill="none" stroke="{{border}}" stroke-width="1"/>
  <rect x="220" y="200" width="500" height="500" fill="none" stroke="{{ink}}" stroke-width="2"/>
  <path d="M220,300H720M220,400H720M220,500H720M220,600H720M320,200V700M420,200V700M520,200V700M620,200V700" stroke="{{border}}" stroke-width="1"/>
  <rect x="840" y="200" width="48" height="500" fill="{{plum}}" opacity="0.85"/>
  <rect x="940" y="426" width="300" height="48" fill="{{plum}}" opacity="0.85"/>
  <line x1="720" y1="450" x2="1380" y2="450" stroke="{{ink}}" stroke-width="2"/>
  <path d="M888,450H940M1240,450H1380" stroke="{{plum}}" stroke-width="3.5"/>
  <circle cx="1300" cy="450" r="10" fill="none" stroke="{{plum}}" stroke-width="3"/>
  <circle cx="1380" cy="450" r="7" fill="{{plum}}"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.055"/>
</svg>
