<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
  <title>A wide field of faint cells funnels through a narrow gap into a small bordered cluster of solid cells</title>
  <desc>On the left, a large rectangular area is filled with a dense grid of faint empty cells. Two hairlines converge from its right edge toward a narrow gap. A horizontal line labelled plain text runs through into the gap. On the right, a small bordered box holds six solid cells in two rows, with a seventh cell tilted and hanging half outside the lower border. A square bracket shape sits just to the right of the box.</desc>
  <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/></filter>
  <defs>
    <pattern id="warehouse" width="52" height="34" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="44" height="26" fill="none" stroke="{{ink}}" stroke-width="1.4" opacity="0.22"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="{{paper}}"/>
  <rect x="150" y="210" width="468" height="476" fill="url(#warehouse)"/>
  <g stroke="{{ink}}" stroke-width="1.6" opacity="0.4" fill="none">
    <path d="M618 250 L892 432"/>
    <path d="M618 646 L892 466"/>
  </g>
  <line x1="120" y1="449" x2="905" y2="449" stroke="{{ink}}" stroke-width="2" opacity="0.55"/>
  <text x="150" y="434" font-family="Inter, sans-serif" font-size="22" fill="{{ink}}" opacity="0.6">plain text</text>
  <line x1="905" y1="449" x2="946" y2="451" stroke="{{moss}}" stroke-width="2.5"/>
  <rect x="946" y="366" width="252" height="172" fill="none" stroke="{{moss}}" stroke-width="2.5"/>
  <g fill="{{moss}}">
    <rect x="962" y="386" width="64" height="40" opacity="0.85"/>
    <rect x="1036" y="386" width="64" height="40" opacity="0.85"/>
    <rect x="1110" y="386" width="64" height="40" opacity="0.85"/>
    <rect x="962" y="446" width="64" height="40" opacity="0.85"/>
    <rect x="1036" y="446" width="64" height="40" opacity="0.85"/>
    <rect x="1110" y="446" width="64" height="40" opacity="0.85"/>
  </g>
  <rect x="1034" y="512" width="64" height="40" fill="{{moss}}" opacity="0.9" transform="rotate(-6 1066 532)"/>
  <line x1="1198" y1="452" x2="1232" y2="452" stroke="{{moss}}" stroke-width="2.5"/>
  <path d="M1232 398 h44 v108 h-44" fill="none" stroke="{{moss}}" stroke-width="3"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.055"/>
</svg>
