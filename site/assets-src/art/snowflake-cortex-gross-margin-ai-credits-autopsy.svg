<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
  <title>Snowflake Cortex Gross Margin Compression and Quota Lanes</title>
  <desc>Nested gross margin frames stepping inward on the left beside three horizontal AI credit quota lanes and a vertical telemetry lag bar on the right.</desc>
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="{{paper}}"/>
  <g stroke="{{border}}" stroke-width="1.5" fill="none">
    <line x1="140" y1="160" x2="1460" y2="160"/>
    <line x1="140" y1="740" x2="1460" y2="740"/>
    <line x1="780" y1="160" x2="780" y2="740"/>
  </g>
  <g stroke="{{ink}}" stroke-width="2" fill="none">
    <rect x="200" y="210" width="500" height="480"/>
    <rect x="230" y="240" width="440" height="420"/>
    <rect x="260" y="270" width="380" height="372"/>
    <line x1="860" y1="290" x2="1360" y2="290"/>
    <line x1="860" y1="450" x2="1360" y2="450"/>
    <line x1="860" y1="610" x2="1430" y2="610"/>
    <line x1="1220" y1="210" x2="1220" y2="690"/>
  </g>
  <rect x="200" y="210" width="30" height="480" fill="{{moss}}"/>
  <rect x="1220" y="276" width="18" height="28" fill="{{ink}}"/>
  <rect x="1220" y="436" width="18" height="28" fill="{{ink}}"/>
  <rect x="1220" y="596" width="18" height="28" fill="{{moss}}"/>
  <circle cx="1430" cy="610" r="6" fill="{{moss}}"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.05"/>
</svg>
