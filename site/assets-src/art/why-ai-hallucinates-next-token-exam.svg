<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
  <title>Next-Token Prediction Choosing Unanchored Guessing Over Abstention</title>
  <desc>Three solid rectangular token blocks on the left feed into a central decision circle at x=760: the upper ink abstention path terminates at a vertical zero-point bar, while the lower plum path arcs across the threshold to form three hollow citation rectangles on the right, the last of which is tilted off-axis without a ground line.</desc>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="{{paper}}"/>
  <g stroke="{{border}}" stroke-width="1" opacity="0.55">
    <line x1="120" y1="240" x2="1480" y2="240"/>
    <line x1="120" y1="450" x2="1480" y2="450"/>
    <line x1="120" y1="680" x2="1480" y2="680"/>
    <line x1="760" y1="100" x2="760" y2="800" stroke-dasharray="6 6"/>
  </g>
  <g stroke="{{ink}}" stroke-width="2.2" fill="none">
    <rect x="160" y="400" width="140" height="100"/>
    <rect x="350" y="400" width="140" height="100"/>
    <rect x="540" y="400" width="140" height="100"/>
    <line x1="230" y1="500" x2="230" y2="680"/>
    <line x1="420" y1="500" x2="420" y2="680"/>
    <line x1="610" y1="500" x2="610" y2="680"/>
    <line x1="300" y1="450" x2="350" y2="450"/>
    <line x1="490" y1="450" x2="490" y2="450"/>
    <line x1="490" y1="450" x2="540" y2="450"/>
    <line x1="680" y1="450" x2="730" y2="450"/>
    <circle cx="760" cy="450" r="30"/>
    <path d="M 760 420 C 760 280, 860 240, 980 240"/>
    <line x1="980" y1="205" x2="980" y2="275" stroke-width="3.5"/>
  </g>
  <g stroke="{{plum}}" stroke-width="3.2" fill="none">
    <path d="M 790 450 C 850 450, 860 540, 920 540"/>
    <rect x="920" y="490" width="140" height="100" stroke-dasharray="6 4"/>
    <line x1="1060" y1="540" x2="1110" y2="540"/>
    <rect x="1110" y="490" width="140" height="100" stroke-dasharray="6 4"/>
    <line x1="1250" y1="540" x2="1300" y2="520" stroke-dasharray="5 5"/>
    <rect x="1300" y="460" width="140" height="100" transform="rotate(-9 1370 510)"/>
  </g>
  <g fill="{{ink}}">
    <circle cx="230" cy="680" r="5"/>
    <circle cx="420" cy="680" r="5"/>
    <circle cx="610" cy="680" r="5"/>
    <circle cx="760" cy="450" r="6"/>
    <circle cx="980" cy="240" r="6"/>
  </g>
  <g fill="{{plum}}">
    <circle cx="920" cy="540" r="6"/>
    <circle cx="1110" cy="540" r="6"/>
    <circle cx="1300" cy="520" r="7"/>
  </g>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.05"/>
</svg>
