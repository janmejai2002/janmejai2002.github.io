<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
  <title>Unredacted Agent Traces Escalating to Marketplace Cache Poisoning</title>
  <desc>Four geometric stages across a precision grid: a left storage stack of trace lines contains one glowing mizu line that escapes rightward, pivots through a central SaaS diamond, and injects an offset mizu block into the right-hand marketplace cache while breaking the clean vertical link from the top upstream registry.</desc>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="{{paper}}"/>
  <g stroke="{{border}}" stroke-width="1" opacity="0.55">
    <line x1="120" y1="200" x2="1480" y2="200"/>
    <line x1="120" y1="450" x2="1480" y2="450"/>
    <line x1="120" y1="700" x2="1480" y2="700"/>
    <line x1="340" y1="100" x2="340" y2="800"/>
    <line x1="760" y1="100" x2="760" y2="800"/>
    <line x1="1180" y1="100" x2="1180" y2="800"/>
  </g>
  <g stroke="{{ink}}" stroke-width="2" fill="none">
    <rect x="200" y="390" width="280" height="280"/>
    <line x1="230" y1="440" x2="450" y2="440" opacity="0.5"/>
    <line x1="230" y1="490" x2="450" y2="490" opacity="0.5"/>
    <line x1="230" y1="590" x2="450" y2="590" opacity="0.5"/>
    <line x1="230" y1="630" x2="450" y2="630" opacity="0.5"/>
    <rect x="670" y="450" width="180" height="180"/>
    <rect x="1060" y="130" width="240" height="120"/>
    <rect x="1060" y="470" width="240" height="180"/>
    <line x1="1180" y1="250" x2="1180" y2="395"/>
    <line x1="1180" y1="435" x2="1180" y2="470" stroke-dasharray="4 4"/>
  </g>
  <g stroke="{{mizu}}" stroke-width="3.2" fill="none">
    <line x1="230" y1="540" x2="670" y2="540"/>
    <line x1="850" y1="540" x2="1085" y2="540"/>
    <rect x="1085" y="505" width="235" height="70"/>
    <line x1="1320" y1="540" x2="1450" y2="540" stroke-dasharray="6 5"/>
  </g>
  <g fill="{{mizu}}">
    <circle cx="230" cy="540" r="6"/>
    <circle cx="480" cy="540" r="6"/>
    <circle cx="760" cy="540" r="7"/>
    <circle cx="1085" cy="540" r="6"/>
    <circle cx="1450" cy="540" r="6"/>
  </g>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.05"/>
</svg>
