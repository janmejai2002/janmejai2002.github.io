<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
  <title>Cap-and-Discover AI Budget Governance</title>
  <desc>Geometric diagram of vertical usage bars beneath a horizontal spending ceiling, where one ochre bar breaks through the cap to feed shared workflow lanes.</desc>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="{{paper}}"/>
  <rect x="120" y="100" width="1360" height="700" fill="none" stroke="{{border}}" stroke-width="1"/>
  <line x1="180" y1="700" x2="1420" y2="700" stroke="{{ink}}" stroke-width="2"/>
  <line x1="180" y1="360" x2="960" y2="360" stroke="{{ink}}" stroke-width="2.5" stroke-dasharray="10,6"/>
  <rect x="220" y="520" width="70" height="180" fill="none" stroke="{{ink}}" stroke-width="1.5"/>
  <rect x="330" y="460" width="70" height="240" fill="none" stroke="{{ink}}" stroke-width="1.5"/>
  <rect x="440" y="560" width="70" height="140" fill="none" stroke="{{ink}}" stroke-width="1.5"/>
  <rect x="550" y="210" width="70" height="490" fill="{{ochre}}" opacity="0.85"/>
  <rect x="660" y="490" width="70" height="210" fill="none" stroke="{{ink}}" stroke-width="1.5"/>
  <rect x="770" y="420" width="70" height="280" fill="none" stroke="{{ink}}" stroke-width="1.5"/>
  <path d="M620,245H1380M840,305H1380M840,425H1380M840,545H1380" stroke="{{ochre}}" stroke-width="2.5"/>
  <path d="M840,245V545" stroke="{{ochre}}" stroke-width="2"/>
  <circle cx="585" cy="210" r="8" fill="{{ochre}}"/>
  <circle cx="840" cy="245" r="7" fill="{{ochre}}"/>
  <circle cx="1380" cy="245" r="7" fill="{{ochre}}"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.055"/>
</svg>
