<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
  <title>Uber Code-Mode token compression and AI Context Graph routing</title>
  <desc>Stacked wide rectangles on the left compress into a moss-accented subprocess loop, paired with a circular node graph and a broken ungrounded search line below.</desc>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="{{paper}}"/>
  <rect x="80" y="80" width="1440" height="740" fill="none" stroke="{{border}}" stroke-width="1.5"/>
  <line x1="800" y1="80" width="1" stroke="{{border}}" stroke-width="1"/>
  <line x1="800" y1="80" x2="800" y2="820" stroke="{{border}}" stroke-width="1"/>
  <rect x="140" y="160" width="460" height="80" fill="none" stroke="{{ink}}" stroke-width="2"/>
  <rect x="140" y="260" width="460" height="80" fill="none" stroke="{{ink}}" stroke-width="2"/>
  <rect x="140" y="360" width="460" height="80" fill="none" stroke="{{border}}" stroke-width="1.5"/>
  <rect x="140" y="460" width="460" height="80" fill="none" stroke="{{border}}" stroke-width="1.5"/>
  <line x1="600" y1="200" x2="670" y2="330" stroke="{{ink}}" stroke-width="1.5"/>
  <line x1="600" y1="300" x2="670" y2="345" stroke="{{ink}}" stroke-width="1.5"/>
  <line x1="600" y1="400" x2="670" y2="365" stroke="{{border}}" stroke-width="1.5"/>
  <line x1="600" y1="500" x2="670" y2="380" stroke="{{border}}" stroke-width="1.5"/>
  <rect x="670" y="290" width="90" height="130" fill="{{moss}}" fill-opacity="0.22" stroke="{{moss}}" stroke-width="3"/>
  <circle cx="715" cy="355" r="24" fill="none" stroke="{{moss}}" stroke-width="2.5"/>
  <line x1="140" y1="620" x2="760" y2="620" stroke="{{ink}}" stroke-width="2"/>
  <rect x="140" y="605" width="220" height="30" fill="none" stroke="{{ink}}" stroke-width="1.5"/>
  <rect x="360" y="605" width="400" height="30" fill="{{moss}}" fill-opacity="0.2" stroke="{{moss}}" stroke-width="2"/>
  <circle cx="1140" cy="340" r="170" fill="none" stroke="{{border}}" stroke-width="1.5"/>
  <line x1="1030" y1="270" x2="1140" y2="210" stroke="{{ink}}" stroke-width="1.5"/>
  <line x1="1140" y1="210" x2="1250" y2="290" stroke="{{ink}}" stroke-width="1.5"/>
  <line x1="1030" y1="270" x2="1120" y2="360" stroke="{{moss}}" stroke-width="2.5"/>
  <line x1="1120" y1="360" x2="1250" y2="290" stroke="{{moss}}" stroke-width="2.5"/>
  <line x1="1030" y1="270" x2="1050" y2="420" stroke="{{border}}" stroke-width="1.5"/>
  <line x1="1050" y1="420" x2="1210" y2="430" stroke="{{ink}}" stroke-width="1.5"/>
  <line x1="1120" y1="360" x2="1210" y2="430" stroke="{{moss}}" stroke-width="2.5"/>
  <circle cx="1030" cy="270" r="14" fill="{{paper}}" stroke="{{ink}}" stroke-width="2"/>
  <circle cx="1140" cy="210" r="12" fill="{{paper}}" stroke="{{ink}}" stroke-width="2"/>
  <circle cx="1250" cy="290" r="16" fill="{{moss}}" stroke="{{ink}}" stroke-width="2"/>
  <circle cx="1120" cy="360" r="20" fill="{{moss}}" stroke="{{ink}}" stroke-width="2.5"/>
  <circle cx="1050" cy="420" r="12" fill="{{paper}}" stroke="{{ink}}" stroke-width="2"/>
  <circle cx="1210" cy="430" r="15" fill="{{paper}}" stroke="{{ink}}" stroke-width="2"/>
  <line x1="900" y1="590" x2="1440" y2="590" stroke="{{moss}}" stroke-width="3.5"/>
  <circle cx="900" cy="590" r="6" fill="{{moss}}"/>
  <circle cx="1440" cy="590" r="6" fill="{{moss}}"/>
  <path d="M900,670 L1010,720 L1080,660 L1160,740 L1230,685" fill="none" stroke="{{ink}}" stroke-width="2" stroke-dasharray="8,6"/>
  <line x1="1250" y1="655" x2="1250" y2="735" stroke="{{ink}}" stroke-width="2.5"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.05"/>
</svg>
