<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
<title>Datadog Bits AI Cost Compression and Context Exhaustion Diagram</title>
<desc>Geometric diagram of three narrowing telemetry funnels feeding a central MCP code-execution sandbox and a compact diagnostic output, with one upper trace breaking into a dashed loop in moss green to show broad-search context exhaustion.</desc>
<defs>
<filter id="grain">
<feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
</filter>
</defs>
<rect width="1600" height="900" fill="{{paper}}"/>
<g stroke="{{border}}" stroke-width="1" fill="none">
<line x1="120" y1="140" x2="1480" y2="140"/>
<line x1="120" y1="760" x2="1480" y2="760"/>
<line x1="560" y1="140" x2="560" y2="760"/>
<line x1="1040" y1="140" x2="1040" y2="760"/>
</g>
<g stroke="{{ink}}" stroke-width="2" fill="none">
<polygon points="180,220 480,310 480,350 180,320"/>
<polygon points="180,380 480,430 480,470 180,520"/>
<polygon points="180,580 480,550 480,590 180,680"/>
<line x1="480" y1="330" x2="620" y2="410"/>
<line x1="480" y1="450" x2="620" y2="450"/>
<line x1="480" y1="570" x2="620" y2="490"/>
<rect x="620" y="340" width="320" height="220"/>
<rect x="660" y="380" width="240" height="140" stroke="{{border}}" stroke-width="1.5"/>
<line x1="690" y1="425" x2="870" y2="425"/>
<line x1="690" y1="455" x2="830" y2="455"/>
<line x1="690" y1="485" x2="790" y2="485"/>
<line x1="940" y1="450" x2="1120" y2="450"/>
<circle cx="1120" cy="450" r="6" fill="{{ink}}"/>
<rect x="1160" y="390" width="240" height="120"/>
<line x1="1190" y1="435" x2="1370" y2="435"/>
<line x1="1190" y1="465" x2="1320" y2="465"/>
</g>
<g stroke="{{moss}}" stroke-width="3" fill="none">
<path d="M 480 330 L 620 240 L 920 240 L 920 310" stroke-dasharray="10 6"/>
<circle cx="920" cy="310" r="18" stroke-dasharray="6 4"/>
<line x1="908" y1="298" x2="932" y2="322"/>
<line x1="932" y1="298" x2="908" y2="322"/>
</g>
<rect width="1600" height="900" filter="url(#grain)" opacity="0.05"/>
</svg>
