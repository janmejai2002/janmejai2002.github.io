<line x1="560" y1="450" x2="480" y2="450" stroke="{{ink}}" stroke-width="1.5"/>
<line x1="1040" y1="450" x2="1120" y2="450" stroke="{{ink}}" stroke-width="1.5"/>
<circle cx="800" cy="130" r="12" fill="{{paper}}" stroke="{{ink}}" stroke-width="2"/>
<circle cx="800" cy="770" r="12" fill="{{paper}}" stroke="{{ink}}" stroke-width="2"/>
<circle cx="480" cy="450" r="12" fill="{{paper}}" stroke="{{ink}}" stroke-width="2"/>
<circle cx="1120" cy="450" r="12" fill="{{paper}}" stroke="{{ink}}" stroke-width="2"/>
<rect x="850" y="475" width="46" height="46" fill="none" stroke="{{hanko}}" stroke-width="3"/>
<rect x="858" y="483" width="30" height="30" fill="{{hanko}}" fill-opacity="0.15" stroke="{{hanko}}" stroke-width="1"/>
<circle cx="873" cy="498" r="6" fill="{{hanko}}"/>
<rect width="1600" height="900" filter="url(#grain)" opacity="0.05"/>
