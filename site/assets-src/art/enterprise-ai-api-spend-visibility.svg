<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
  <title>Enterprise AI API Spend Bypassing Late Procurement Gates into a 4.7x Overrun</title>
  <desc>A compact left-hand rectangle representing the 1.9x planned budget connects to a tall right-hand ochre column representing 4.7x actual spend; a half-height vertical gate positioned late at x=1060 catches only the bottom third of ink lines while the top two-thirds of ochre API lines flow unobstructed above it.</desc>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="{{paper}}"/>
  <g stroke="{{border}}" stroke-width="1" opacity="0.55">
    <line x1="120" y1="180" x2="1480" y2="180"/>
    <line x1="120" y1="450" x2="1480" y2="450"/>
    <line x1="120" y1="740" x2="1480" y2="740"/>
    <line x1="460" y1="120" x2="460" y2="780" stroke-dasharray="6 6"/>
    <line x1="1060" y1="120" x2="1060" y2="780"/>
  </g>
  <g stroke="{{ink}}" stroke-width="2.2" fill="none">
    <rect x="180" y="510" width="220" height="230"/>
    <line x1="400" y1="580" x2="1220" y2="580"/>
    <line x1="400" y1="660" x2="1220" y2="660"/>
    <line x1="1060" y1="500" x2="1060" y2="760" stroke-width="3.5"/>
    <rect x="1042" y="562" width="36" height="36"/>
    <rect x="1042" y="642" width="36" height="36"/>
  </g>
  <g stroke="{{ochre}}" stroke-width="3.2" fill="none">
    <rect x="1220" y="180" width="200" height="560"/>
    <path d="M 400 520 C 620 520, 740 240, 1220 240"/>
    <path d="M 400 540 C 640 540, 760 320, 1220 320"/>
    <path d="M 400 560 C 660 560, 780 400, 1220 400"/>
    <path d="M 400 570 C 680 570, 800 470, 1220 470"/>
    <line x1="1060" y1="180" x2="1060" y2="480" stroke-dasharray="4 10" opacity="0.45"/>
  </g>
  <g fill="{{ink}}">
    <circle cx="240" cy="580" r="5"/>
    <circle cx="320" cy="580" r="5"/>
    <circle cx="240" cy="660" r="5"/>
    <circle cx="320" cy="660" r="5"/>
    <circle cx="1060" cy="580" r="6"/>
    <circle cx="1060" cy="660" r="6"/>
  </g>
  <g fill="{{ochre}}">
    <circle cx="400" cy="520" r="6"/>
    <circle cx="1220" cy="240" r="7"/>
    <circle cx="1220" cy="320" r="7"/>
    <circle cx="1220" cy="400" r="7"/>
    <circle cx="1220" cy="470" r="7"/>
  </g>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.05"/>
</svg>
