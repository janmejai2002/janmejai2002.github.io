<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
  <title>Intuit GenOS Architecture</title>
  <desc>Minimalist geometric diagram illustrating an enterprise generative AI operating system with an isolated deterministic calculation core.</desc>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="{{paper}}"/>
  <path d="M80,80h1440v740h-1440zM80,450h1440M450,80v740M1150,80v740" fill="none" stroke="{{border}}" stroke-width="1"/>
  <circle cx="450" cy="450" r="150" fill="none" stroke="{{ink}}" stroke-width="2"/>
  <circle cx="450" cy="450" r="50" fill="none" stroke="{{ink}}" stroke-width="1.5"/>
  <path d="M450,300v-80M450,600v80M300,450h-90M600,450h90" stroke="{{border}}" stroke-width="1.5"/>
  <rect x="720" y="240" width="120" height="420" fill="none" stroke="{{border}}" stroke-width="1"/>
  <rect x="720" y="240" width="120" height="150" fill="{{ink}}" fill-opacity="0.08" stroke="{{ink}}" stroke-width="1.5"/>
  <rect x="740" y="420" width="120" height="180" fill="{{moss}}" fill-opacity="0.22" stroke="{{moss}}" stroke-width="2.5"/>
  <line x1="860" y1="510" x2="1150" y2="510" stroke="{{moss}}" stroke-width="2" stroke-dasharray="6,8"/>
  <circle cx="1150" cy="450" r="140" fill="none" stroke="{{ink}}" stroke-width="2"/>
  <path d="M1150,310 A140,140 0 0,1 1290,450" fill="none" stroke="{{moss}}" stroke-width="3"/>
  <line x1="1290" y1="450" x2="1370" y2="450" stroke="{{ink}}" stroke-width="2"/>
  <circle cx="1370" cy="450" r="6" fill="{{ink}}"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.05"/>
</svg>
