<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
  <title>RAG External Reference Lookup vs Fine-Tuning Internal Weight Modification</title>
  <desc>A vertical divider at x=800 splits the plate: on the left, a stack of five external document rectangles sends a bold plum line into an unchanged circular model core; on the right, an internal 4x4 weight grid is reshaped in plum, with one node displaced off-grid.</desc>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="{{paper}}"/>
  <g stroke="{{border}}" stroke-width="1" opacity="0.55">
    <line x1="120" y1="200" x2="1480" y2="200"/>
    <line x1="120" y1="450" x2="1480" y2="450"/>
    <line x1="120" y1="700" x2="1480" y2="700"/>
    <line x1="800" y1="100" x2="800" y2="800" stroke-dasharray="6 6"/>
  </g>
  <g stroke="{{ink}}" stroke-width="2" fill="none">
    <rect x="180" y="210" width="150" height="70"/>
    <rect x="180" y="310" width="150" height="70"/>
    <rect x="180" y="510" width="150" height="70"/>
    <rect x="180" y="610" width="150" height="70"/>
    <circle cx="570" cy="450" r="110"/>
    <circle cx="570" cy="450" r="55" opacity="0.45"/>
  </g>
  <g stroke="{{plum}}" stroke-width="3.5" fill="none">
    <rect x="195" y="410" width="150" height="70"/>
    <line x1="345" y1="445" x2="460" y2="445"/>
  </g>
  <g fill="{{plum}}">
    <circle cx="345" cy="445" r="6"/>
    <circle cx="460" cy="445" r="6"/>
    <circle cx="570" cy="445" r="7"/>
  </g>
  <g stroke="{{ink}}" stroke-width="1.8" opacity="0.55" fill="none">
    <line x1="980" y1="270" x2="1340" y2="270"/>
    <line x1="980" y1="390" x2="1340" y2="390"/>
    <line x1="980" y1="510" x2="1220" y2="510"/>
    <line x1="980" y1="630" x2="1340" y2="630"/>
    <line x1="980" y1="270" x2="980" y2="630"/>
    <line x1="1100" y1="270" x2="1100" y2="630"/>
    <line x1="1220" y1="270" x2="1220" y2="630"/>
    <line x1="1340" y1="270" x2="1340" y2="390"/>
  </g>
  <g stroke="{{plum}}" stroke-width="3" fill="none">
    <path d="M 980 390 L 1100 390 L 1220 510 L 1100 630"/>
    <line x1="1220" y1="510" x2="1375" y2="545" stroke-dasharray="5 5"/>
    <rect x="1357" y="527" width="36" height="36"/>
  </g>
  <g fill="{{ink}}">
    <circle cx="980" cy="270" r="5"/>
    <circle cx="1100" cy="270" r="5"/>
    <circle cx="1220" cy="270" r="5"/>
    <circle cx="1340" cy="270" r="5"/>
    <circle cx="1340" cy="390" r="5"/>
    <circle cx="980" cy="510" r="5"/>
    <circle cx="980" cy="630" r="5"/>
    <circle cx="1220" cy="630" r="5"/>
    <circle cx="1340" cy="630" r="5"/>
  </g>
  <g fill="{{plum}}">
    <circle cx="980" cy="390" r="6"/>
    <circle cx="1100" cy="390" r="6"/>
    <circle cx="1220" cy="510" r="6"/>
    <circle cx="1100" cy="630" r="6"/>
    <circle cx="1375" cy="545" r="6"/>
  </g>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.05"/>
</svg>
