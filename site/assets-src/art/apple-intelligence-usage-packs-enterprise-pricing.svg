<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
  <title>Unpooled AI Usage Packs and 12-Month Expiration Across Enterprise Seats</title>
  <desc>Five isolated vertical columns representing individual Apple Accounts separated by solid vertical walls; uniform ink base bars sit below unequal ochre usage-pack bars, with one ochre bar severed by an expiration cut.</desc>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="{{paper}}"/>
  <g stroke="{{border}}" stroke-width="1" opacity="0.6">
    <line x1="160" y1="200" x2="1440" y2="200"/>
    <line x1="160" y1="360" x2="1440" y2="360"/>
    <line x1="160" y1="520" x2="1440" y2="520"/>
    <line x1="160" y1="680" x2="1440" y2="680"/>
  </g>
  <g stroke="{{ink}}" stroke-width="2" fill="none">
    <line x1="400" y1="140" x2="400" y2="760"/>
    <line x1="660" y1="140" x2="660" y2="760"/>
    <line x1="920" y1="140" x2="920" y2="760"/>
    <line x1="1180" y1="140" x2="1180" y2="760"/>
    <rect x="180" y="610" width="180" height="70"/>
    <rect x="440" y="610" width="180" height="70"/>
    <rect x="700" y="610" width="180" height="70"/>
    <rect x="960" y="610" width="180" height="70"/>
    <rect x="1220" y="610" width="180" height="70"/>
  </g>
  <g stroke="{{ochre}}" stroke-width="3" fill="none">
    <rect x="180" y="450" width="180" height="140"/>
    <rect x="440" y="290" width="180" height="300"/>
    <rect x="700" y="510" width="180" height="80"/>
    <path d="M 960 590 L 960 350 L 1140 430 L 1140 590 Z"/>
    <rect x="1220" y="240" width="180" height="350"/>
  </g>
  <g stroke="{{ochre}}" stroke-width="2" stroke-dasharray="5 5" fill="none">
    <path d="M 960 320 L 960 230 L 1140 230 L 1140 400 L 960 320"/>
    <line x1="940" y1="340" x2="1160" y2="440"/>
  </g>
  <g fill="{{ochre}}">
    <circle cx="270" cy="450" r="5"/>
    <circle cx="530" cy="290" r="5"/>
    <circle cx="790" cy="510" r="5"/>
    <circle cx="1310" cy="240" r="5"/>
  </g>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.05"/>
</svg>
