<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
  <title>Two concentric dials sharing one centre, the outer ring left open</title>
  <desc>A large outer circle carries three short radial ticks but does not close, leaving a clear gap at its lower edge. Twelve faint spokes span the space between it and a smaller, complete inner circle. A short thick arc sits at the top of the inner circle. A loose scatter of small dots surrounds the whole figure.</desc>
