<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
  <title>Correlated Multi-Vendor AI Failure at a Shared SaaS Connector Chokepoint</title>
  <desc>Three separate rectangular blocks at the top send vertical conduits downward into a single central ochre ring at y=480; the ochre ring is fractured on its lower arc, severing all three paths before they can reach the wide enterprise data foundation block at the bottom.</desc>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="{{paper}}"/>
  <g stroke="{{border}}" stroke-width="1" opacity="0.55">
    <line x1="140" y1="200" x2="1460" y2="200"/>
    <line x1="140" y1="480" x2="1460" y2="480"/>
    <line x1="140" y1="730" x2="1460" y2="730"/>
    <line x1="360" y1="100" x2="360" y2="800" stroke-dasharray="5 5"/>
    <line x1="800" y1="100" x2="800" y2="800" stroke-dasharray="5 5"/>
    <line x1="1240" y1="100" x2="1240" y2="800" stroke-dasharray="5 5"/>
  </g>
  <g stroke="{{ink}}" stroke-width="2.5" fill="none">
    <rect x="220" y="130" width="280" height="120"/>
    <rect x="660" y="130" width="280" height="120"/>
    <rect x="1100" y="130" width="280" height="120"/>
    <rect x="220" y="680" width="1160" height="100"/>
    <line x1="360" y1="250" x2="755" y2="450"/>
    <line x1="800" y1="250" x2="800" y2="428"/>
    <line x1="1240" y1="250" x2="845" y2="450"/>
  </g>
  <g stroke="{{ochre}}" stroke-width="3.5" fill="none">
    <path d="M 765 515 A 52 52 0 1 1 842 510"/>
    <line x1="755" y1="530" x2="725" y2="660" stroke-dasharray="6 6"/>
    <line x1="800" y1="540" x2="800" y2="660" stroke-dasharray="6 6"/>
    <line x1="845" y1="530" x2="875" y2="660" stroke-dasharray="6 6"/>
    <line x1="780" y1="460" x2="820" y2="500"/>
    <line x1="820" y1="460" x2="780" y2="500"/>
  </g>
  <g fill="{{ink}}">
    <circle cx="360" cy="190" r="6"/>
    <circle cx="800" cy="190" r="6"/>
    <circle cx="1240" cy="190" r="6"/>
  </g>
  <g fill="{{ochre}}">
    <circle cx="755" cy="450" r="6"/>
    <circle cx="800" cy="428" r="6"/>
    <circle cx="845" cy="450" r="6"/>
  </g>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.05"/>
</svg>
