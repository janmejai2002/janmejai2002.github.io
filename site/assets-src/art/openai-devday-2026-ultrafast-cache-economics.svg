<svg viewBox="0 0 1600 900" width="1600" height="900" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>95 Percent Prefix Cache vs. 300 tok/s Memory-Bound Decode</title>
  <desc>Minimal geometric diagram contrasting a dense anchored stack of cached prefix blocks on the left with eight high-velocity decode bars and a vermilion hanko pulse on the right.</desc>
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="{{paper}}"/>
  <rect x="180" y="190" width="460" height="520" fill="none" stroke="{{border}}" stroke-width="3"/>
  <rect x="220" y="230" width="380" height="84" fill="{{ink}}"/>
  <rect x="220" y="334" width="380" height="84" fill="{{ink}}"/>
  <rect x="220" y="438" width="380" height="84" fill="{{ink}}"/>
  <rect x="220" y="542" width="380" height="84" fill="{{ink}}"/>
  <rect x="528" y="242" width="60" height="60" fill="{{hanko}}"/>
  <line x1="640" y1="450" x2="860" y2="450" stroke="{{ink}}" stroke-width="3"/>
  <circle cx="750" cy="450" r="10" fill="{{hanko}}"/>
  <rect x="860" y="190" width="560" height="520" fill="none" stroke="{{ink}}" stroke-width="3.5"/>
  <rect x="900" y="230" width="480" height="28" fill="{{hanko}}"/>
  <rect x="900" y="286" width="440" height="28" fill="{{ink}}"/>
  <rect x="900" y="342" width="400" height="28" fill="{{ink}}"/>
  <rect x="900" y="398" width="460" height="28" fill="{{ink}}"/>
  <rect x="900" y="454" width="360" height="28" fill="{{ink}}"/>
  <rect x="900" y="510" width="420" height="28" fill="{{ink}}"/>
  <rect x="900" y="566" width="390" height="28" fill="{{ink}}"/>
  <rect x="900" y="622" width="480" height="28" fill="{{hanko}}"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.05"/>
</svg>
