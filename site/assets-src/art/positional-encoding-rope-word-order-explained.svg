<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
  <title>Rotary Positional Embeddings as Clock Hands</title>
  <desc>Geometric diagram of five circular dials along a sequence rail where plum hands rotate progressively by position, with one over-extended hand representing context-limit stretch.</desc>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="{{paper}}"/>
  <rect x="120" y="100" width="1360" height="700" fill="none" stroke="{{border}}" stroke-width="1"/>
  <line x1="180" y1="640" x2="1420" y2="640" stroke="{{ink}}" stroke-width="2"/>
  <circle cx="280" cy="400" r="95" fill="none" stroke="{{ink}}" stroke-width="2"/>
  <circle cx="540" cy="400" r="95" fill="none" stroke="{{ink}}" stroke-width="2"/>
  <circle cx="800" cy="400" r="95" fill="none" stroke="{{ink}}" stroke-width="2"/>
  <circle cx="1060" cy="400" r="95" fill="none" stroke="{{border}}" stroke-width="2" stroke-dasharray="8,6"/>
  <circle cx="1320" cy="400" r="95" fill="none" stroke="{{ink}}" stroke-width="2"/>
  <path d="M280,400V315M540,400L600,340M800,400H885M1320,400L1260,460" stroke="{{plum}}" stroke-width="3.5"/>
  <line x1="1060" y1="400" x2="1145" y2="485" stroke="{{plum}}" stroke-width="3.5"/>
  <path d="M280,495V640M540,495V640M800,495V640M1060,495V640M1320,495V640" stroke="{{border}}" stroke-width="1.5" stroke-dasharray="5,5"/>
  <circle cx="280" cy="640" r="6" fill="{{ink}}"/>
  <circle cx="540" cy="640" r="6" fill="{{ink}}"/>
  <circle cx="800" cy="640" r="6" fill="{{ink}}"/>
  <circle cx="1060" cy="640" r="7" fill="{{plum}}"/>
  <circle cx="1320" cy="640" r="6" fill="{{ink}}"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.055"/>
</svg>
