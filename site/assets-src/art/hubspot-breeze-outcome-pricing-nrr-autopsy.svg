<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
  <title>HubSpot Breeze Outcome Pricing and 72-Hour Settlement Ring</title>
  <desc>Stepped credit columns halved on the left beside an unclosed 72-hour settlement arc and an off-grid moss anchor block on the right.</desc>
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="{{paper}}"/>
  <g stroke="{{border}}" stroke-width="1.5" fill="none">
    <line x1="140" y1="160" x2="1460" y2="160"/>
    <line x1="140" y1="740" x2="1460" y2="740"/>
    <line x1="800" y1="160" x2="800" y2="740"/>
    <line x1="220" y1="240" x2="720" y2="240"/>
    <line x1="220" y1="490" x2="720" y2="490"/>
  </g>
  <g stroke="{{ink}}" stroke-width="2" fill="none">
    <rect x="240" y="240" width="140" height="500"/>
    <line x1="240" y1="490" x2="380" y2="490"/>
    <rect x="460" y="490" width="140" height="250"/>
    <line x1="530" y1="490" x2="530" y2="785"/>
    <path d="M 1140 250 A 200 200 0 1 1 948 392"/>
    <path d="M 1140 310 A 140 140 0 1 0 1280 450"/>
  </g>
  <rect x="1116" y="426" width="48" height="48" fill="{{moss}}"/>
  <rect x="460" y="490" width="140" height="14" fill="{{moss}}"/>
  <circle cx="1140" cy="250" r="5" fill="{{ink}}"/>
  <circle cx="948" cy="392" r="5" fill="{{moss}}"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.05"/>
</svg>
