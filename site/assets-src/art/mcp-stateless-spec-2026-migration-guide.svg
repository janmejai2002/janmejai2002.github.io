<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
  <title>A heavy thread that stops short, and four separate rings standing on the dashed line where it used to run</title>
  <desc>A thick horizontal bar runs in from the left and ends abruptly at a short vertical cut mark. Beyond the cut the line continues only as a faint dashed rule. Four evenly spaced rings sit along it, each holding a single dot at its centre, none of them joined to the others.</desc>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
  </filter>
  <rect width="1600" height="900" fill="{{paper}}"/>

  <line x1="208" y1="450" x2="452" y2="450" stroke="{{ink}}" stroke-width="16" stroke-linecap="butt" opacity="0.72"/>

  <line x1="472" y1="384" x2="472" y2="516" stroke="{{hanko}}" stroke-width="6"/>

  <line x1="512" y1="450" x2="1392" y2="450" stroke="{{ink}}" stroke-width="3"
        stroke-dasharray="10 16" opacity="0.24"/>

  <g fill="none" stroke="{{mizu}}" stroke-width="14">
    <circle cx="620" cy="450" r="66"/>
    <circle cx="820" cy="450" r="66"/>
    <circle cx="1020" cy="450" r="66"/>
    <circle cx="1220" cy="450" r="66"/>
  </g>

  <g fill="{{ink}}" opacity="0.78">
    <circle cx="620" cy="450" r="11"/>
    <circle cx="820" cy="450" r="11"/>
    <circle cx="1020" cy="450" r="11"/>
    <circle cx="1220" cy="450" r="11"/>
  </g>

  <rect width="1600" height="900" filter="url(#grain)" opacity="0.055"/>
</svg>
