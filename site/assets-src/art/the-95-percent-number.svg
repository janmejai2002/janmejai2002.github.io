  <circle cx="800" cy="450" r="290" fill="none" stroke="{{border}}" stroke-width="1.5"/>
  <path d="M 800 160 A 290 290 0 1 1 710.39 174.19" fill="none" stroke="{{plum}}" stroke-width="26" stroke-linecap="butt"/>
  <g stroke="{{ink}}" stroke-width="2" stroke-dasharray="8 10" opacity="0.38">
    <line x1="682" y1="450" x2="918" y2="450"/>
    <line x1="800" y1="332" x2="800" y2="568"/>
  </g>
  <rect x="754" y="404" width="92" height="92" fill="none" stroke="{{ink}}" stroke-width="2.5" stroke-dasharray="7 9" opacity="0.5"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.055"/>
</svg>
