<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
  <title>An arc drawn to ninety-five percent around an unmarked centre</title>
  <desc>A heavy circular arc covers most of a circle but stops short of closing. At its centre, where an origin point would be, there is only a faint dashed cross and an empty square. A measuring scale at the left has its lowest mark faded out.</desc>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
  </filter>
  <rect width="1600" height="900" fill="{{paper}}"/>
  <g stroke="{{ink}}" stroke-width="3">
    <line x1="196" y1="214" x2="254" y2="214" opacity="0.4"/>
    <line x1="196" y1="238" x2="232" y2="238" opacity="0.4"/>
    <line x1="196" y1="262" x2="232" y2="262" opacity="0.4"/>
    <line x1="196" y1="286" x2="232" y2="286" opacity="0.4"/>
    <line x1="196" y1="310" x2="232" y2="310" opacity="0.4"/>
    <line x1="196" y1="334" x2="254" y2="334" opacity="0.4"/>
    <line x1="196" y1="358" x2="232" y2="358" opacity="0.4"/>
    <line x1="196" y1="382" x2="232" y2="382" opacity="0.4"/>
    <line x1="196" y1="406" x2="232" y2="406" opacity="0.4"/>
    <line x1="196" y1="430" x2="232" y2="430" opacity="0.4"/>
    <line x1="196" y1="454" x2="254" y2="454" opacity="0.4"/>
    <line x1="196" y1="478" x2="232" y2="478" opacity="0.4"/>
    <line x1="196" y1="502" x2="232" y2="502" opacity="0.4"/>
    <line x1="196" y1="526" x2="232" y2="526" opacity="0.4"/>
    <line x1="196" y1="550" x2="232" y2="550" opacity="0.4"/>
    <line x1="196" y1="574" x2="254" y2="574" opacity="0.4"/>
    <line x1="196" y1="598" x2="232" y2="598" opacity="0.4"/>
    <line x1="196" y1="622" x2="232" y2="622" opacity="0.4"/>
    <line x1="196" y1="646" x2="232" y2="646" opacity="0.4"/>
    <line x1="196" y1="670" x2="232" y2="670" opacity="0.4"/>
    <line x1="196" y1="694" x2="254" y2="694" opacity="0.12"/>
