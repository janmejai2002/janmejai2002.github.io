<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
  <title>Query Key Value Library Catalog Lookup in Self-Attention</title>
  <desc>Three horizontal tiers on a fine grid: a single plum Query circle at the bottom sends five rays to a middle row of Key index bars; the second Key bar in plum connects strongly upward to its top Value block, while the fourth Key bar is tilted and disconnected.</desc>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="{{paper}}"/>
  <g stroke="{{border}}" stroke-width="1" opacity="0.6">
    <line x1="160" y1="210" x2="1440" y2="210"/>
    <line x1="160" y1="470" x2="1440" y2="470"/>
    <line x1="160" y1="740" x2="1440" y2="740"/>
    <line x1="320" y1="120" x2="320" y2="800" stroke-dasharray="5 5"/>
    <line x1="560" y1="120" x2="560" y2="800" stroke-dasharray="5 5"/>
    <line x1="800" y1="120" x2="800" y2="800" stroke-dasharray="5 5"/>
    <line x1="1040" y1="120" x2="1040" y2="800" stroke-dasharray="5 5"/>
    <line x1="1280" y1="120" x2="1280" y2="800" stroke-dasharray="5 5"/>
  </g>
  <g stroke="{{ink}}" stroke-width="2" fill="none">
    <rect x="250" y="150" width="140" height="100"/>
    <rect x="730" y="150" width="140" height="100"/>
    <rect x="970" y="150" width="140" height="100" opacity="0.4"/>
    <rect x="1210" y="150" width="140" height="100"/>
    <rect x="295" y="420" width="50" height="100"/>
    <rect x="775" y="420" width="50" height="100"/>
    <rect x="1255" y="420" width="50" height="100"/>
    <path d="M 1025 425 L 1072 435 L 1052 532 L 1005 522 Z"/>
  </g>
  <g stroke="{{ink}}" stroke-width="1.3" opacity="0.45" fill="none">
    <line x1="800" y1="740" x2="320" y2="520"/>
    <line x1="800" y1="740" x2="800" y2="520"/>
    <line x1="800" y1="740" x2="1030" y2="527" stroke-dasharray="5 5"/>
    <line x1="800" y1="740" x2="1280" y2="520"/>
    <line x1="320" y1="420" x2="320" y2="250" stroke-dasharray="4 4"/>
    <line x1="800" y1="420" x2="800" y2="250" stroke-dasharray="4 4"/>
    <line x1="1280" y1="420" x2="1280" y2="250" stroke-dasharray="4 4"/>
  </g>
  <g stroke="{{plum}}" stroke-width="3.5" fill="none">
    <line x1="800" y1="740" x2="560" y2="520"/>
    <rect x="535" y="420" width="50" height="100"/>
    <line x1="560" y1="420" x2="560" y2="250"/>
    <rect x="490" y="150" width="140" height="100"/>
    <circle cx="800" cy="740" r="22"/>
  </g>
  <g fill="{{plum}}">
    <circle cx="800" cy="740" r="6"/>
    <circle cx="560" cy="470" r="6"/>
    <circle cx="560" cy="200" r="7"/>
  </g>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.05"/>
</svg>
