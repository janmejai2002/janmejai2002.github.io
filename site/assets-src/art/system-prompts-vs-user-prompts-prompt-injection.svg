<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
  <title>Instruction Hierarchy and Prompt Injection</title>
  <desc>Geometric diagram of four stacked instruction layers where a lower-priority token stream sends an upward plum line piercing the boundary above it.</desc>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="{{paper}}"/>
  <rect x="120" y="100" width="1360" height="700" fill="none" stroke="{{border}}" stroke-width="1"/>
  <rect x="220" y="160" width="1160" height="110" fill="none" stroke="{{ink}}" stroke-width="2.5"/>
  <rect x="220" y="300" width="1160" height="110" fill="none" stroke="{{ink}}" stroke-width="2"/>
  <rect x="220" y="440" width="1160" height="110" fill="none" stroke="{{ink}}" stroke-width="1.5" stroke-dasharray="10,6"/>
  <rect x="220" y="580" width="1160" height="110" fill="none" stroke="{{border}}" stroke-width="1.5" stroke-dasharray="6,6"/>
  <path d="M300,185V245M340,185V245M380,185V245M420,185V245M460,185V245M300,325V385M340,325V385M380,325V385M300,465V525M340,465V525M300,605V665" stroke="{{ink}}" stroke-width="2"/>
  <rect x="980" y="605" width="340" height="60" fill="{{plum}}" opacity="0.2"/>
  <path d="M1150,635L820,215" fill="none" stroke="{{plum}}" stroke-width="3.5"/>
  <circle cx="1150" cy="635" r="8" fill="{{plum}}"/>
  <circle cx="935" cy="360" r="7" fill="none" stroke="{{plum}}" stroke-width="3"/>
  <circle cx="820" cy="215" r="8" fill="{{plum}}"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.055"/>
</svg>
