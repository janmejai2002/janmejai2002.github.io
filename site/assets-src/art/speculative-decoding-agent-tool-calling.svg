<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
  <title>Speculative Decoding Draft Rejection at the Agent Tool-Call Boundary</title>
  <desc>A horizontal execution timeline divided by a vertical gate at x=780: on the left, curved mizu speculative arcs align with the central ink spine; on the right, speculative mizu branches fracture and terminate at the first verification tick.</desc>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="{{paper}}"/>
  <g stroke="{{border}}" stroke-width="1" opacity="0.55">
    <line x1="120" y1="180" x2="1480" y2="180"/>
    <line x1="120" y1="315" x2="1480" y2="315"/>
    <line x1="120" y1="450" x2="1480" y2="450"/>
    <line x1="120" y1="585" x2="1480" y2="585"/>
    <line x1="120" y1="720" x2="1480" y2="720"/>
    <line x1="300" y1="120" x2="300" y2="780"/>
    <line x1="540" y1="120" x2="540" y2="780"/>
    <line x1="1020" y1="120" x2="1020" y2="780"/>
    <line x1="1260" y1="120" x2="1260" y2="780"/>
  </g>
  <line x1="140" y1="450" x2="1460" y2="450" stroke="{{ink}}" stroke-width="2.5"/>
  <line x1="780" y1="100" x2="780" y2="800" stroke="{{ink}}" stroke-width="2" stroke-dasharray="8 6"/>
  <g stroke="{{mizu}}" stroke-width="3" fill="none">
    <path d="M 180 450 C 230 380, 350 380, 400 450"/>
    <path d="M 400 450 C 450 380, 570 380, 620 450"/>
    <path d="M 620 450 C 660 400, 730 400, 780 450"/>
  </g>
  <g fill="{{mizu}}">
    <circle cx="180" cy="450" r="6"/>
    <circle cx="290" cy="398" r="4.5"/>
    <circle cx="400" cy="450" r="6"/>
    <circle cx="510" cy="398" r="4.5"/>
    <circle cx="620" cy="450" r="6"/>
    <circle cx="780" cy="450" r="7"/>
  </g>
  <g stroke="{{mizu}}" stroke-width="2.2" stroke-dasharray="6 5" fill="none">
    <path d="M 780 450 C 850 370, 930 270, 1020 220"/>
    <path d="M 780 450 C 860 400, 940 340, 1020 315"/>
    <path d="M 780 450 C 860 500, 940 560, 1020 585"/>
    <path d="M 780 450 C 850 530, 930 630, 1020 680"/>
  </g>
  <g stroke="{{mizu}}" stroke-width="2" fill="none">
    <line x1="1010" y1="210" x2="1030" y2="230"/>
    <line x1="1030" y1="210" x2="1010" y2="230"/>
    <line x1="1010" y1="305" x2="1030" y2="325"/>
    <line x1="1030" y1="305" x2="1010" y2="325"/>
    <line x1="1010" y1="575" x2="1030" y2="595"/>
    <line x1="1030" y1="575" x2="1010" y2="595"/>
    <line x1="1010" y1="670" x2="1030" y2="690"/>
    <line x1="1030" y1="670" x2="1010" y2="690"/>
  </g>
  <g fill="{{ink}}">
    <circle cx="840" cy="450" r="5"/>
    <circle cx="900" cy="450" r="5"/>
    <circle cx="960" cy="450" r="5"/>
    <circle cx="1020" cy="450" r="5"/>
    <circle cx="1140" cy="450" r="5"/>
    <circle cx="1260" cy="450" r="5"/>
    <circle cx="1380" cy="450" r="5"/>
  </g>
  <rect x="764" y="434" width="32" height="32" fill="none" stroke="{{mizu}}" stroke-width="2"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.05"/>
