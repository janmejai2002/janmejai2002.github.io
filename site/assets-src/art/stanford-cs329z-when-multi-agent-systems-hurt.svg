<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
<title>Single Agent Track vs Multi-Agent Mesh Collision</title>
<desc>Minimalist geometric blueprint comparing a clean horizontal single-agent path against a four-node multi-agent mesh with a severed diagonal link and cinnabar seal.</desc>
<defs>
<filter id="grain" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
</filter>
</defs>
<rect width="1600" height="900" fill="{{paper}}"/>
<rect x="100" y="100" width="1400" height="700" fill="none" stroke="{{border}}" stroke-width="1"/>
<line x1="100" y1="340" x2="1500" y2="340" stroke="{{border}}" stroke-width="1" stroke-dasharray="4,8"/>
<line x1="260" y1="220" x2="1340" y2="220" stroke="{{ink}}" stroke-width="2.5"/>
<circle cx="260" cy="220" r="18" fill="{{paper}}" stroke="{{ink}}" stroke-width="2.5"/>
<circle cx="800" cy="220" r="18" fill="{{paper}}" stroke="{{ink}}" stroke-width="2.5"/>
<circle cx="1340" cy="220" r="18" fill="{{ink}}"/>
<rect x="480" y="420" width="640" height="300" fill="none" stroke="{{ink}}" stroke-width="2"/>
<line x1="480" y1="420" x2="1120" y2="720" stroke="{{border}}" stroke-width="1.5" stroke-dasharray="6,6"/>
<line x1="480" y1="720" x2="755" y2="591" stroke="{{hanko}}" stroke-width="3"/>
<line x1="845" y1="549" x2="1120" y2="420" stroke="{{hanko}}" stroke-width="3"/>
<circle cx="480" cy="420" r="22" fill="{{paper}}" stroke="{{ink}}" stroke-width="2.5"/>
<circle cx="1120" cy="420" r="22" fill="{{paper}}" stroke="{{ink}}" stroke-width="2.5"/>
<circle cx="480" cy="720" r="22" fill="{{paper}}" stroke="{{ink}}" stroke-width="2.5"/>
<circle cx="1120" cy="720" r="22" fill="{{paper}}" stroke="{{ink}}" stroke-width="2.5"/>
<rect x="778" y="548" width="44" height="44" fill="none" stroke="{{hanko}}" stroke-width="3"/>
<circle cx="800" cy="570" r="7" fill="{{hanko}}"/>
<rect width="1600" height="900" filter="url(#grain)" opacity="0.05"/>
</svg>
