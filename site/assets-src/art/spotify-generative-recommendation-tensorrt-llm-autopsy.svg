<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
  <title>Spotify soft-token projection and TensorRT-LLM beam search optimization</title>
  <desc>Fine horizontal text lines on the left compress into a single moss-filled soft-token circle that feeds a branching beam-search tree into a unified GPU sampler, while a dashed stalled branch sits below.</desc>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="{{paper}}"/>
  <rect x="80" y="80" width="1440" height="740" fill="none" stroke="{{border}}" stroke-width="1.5"/>
  <line x1="140" y1="220" x2="360" y2="220" stroke="{{ink}}" stroke-width="2"/>
  <line x1="140" y1="260" x2="340" y2="260" stroke="{{ink}}" stroke-width="2"/>
  <line x1="140" y1="300" x2="360" y2="300" stroke="{{border}}" stroke-width="1.5"/>
  <line x1="140" y1="340" x2="320" y2="340" stroke="{{ink}}" stroke-width="2"/>
  <line x1="140" y1="380" x2="360" y2="380" stroke="{{border}}" stroke-width="1.5"/>
  <line x1="140" y1="420" x2="350" y2="420" stroke="{{ink}}" stroke-width="2"/>
  <line x1="140" y1="460" x2="330" y2="460" stroke="{{border}}" stroke-width="1.5"/>
  <line x1="140" y1="500" x2="360" y2="500" stroke="{{ink}}" stroke-width="2"/>
  <line x1="360" y1="220" x2="540" y2="360" stroke="{{border}}" stroke-width="1.5"/>
  <line x1="360" y1="360" x2="540" y2="360" stroke="{{ink}}" stroke-width="2"/>
  <line x1="360" y1="500" x2="540" y2="360" stroke="{{border}}" stroke-width="1.5"/>
  <circle cx="575" cy="360" r="35" fill="{{moss}}" fill-opacity="0.24" stroke="{{moss}}" stroke-width="3"/>
  <circle cx="575" cy="360" r="10" fill="{{moss}}"/>
  <line x1="610" y1="360" x2="770" y2="360" stroke="{{moss}}" stroke-width="3"/>
  <line x1="770" y1="360" x2="960" y2="230" stroke="{{moss}}" stroke-width="2.5"/>
  <line x1="770" y1="360" x2="960" y2="360" stroke="{{moss}}" stroke-width="3"/>
  <line x1="770" y1="360" x2="960" y2="490" stroke="{{ink}}" stroke-width="2"/>
  <line x1="960" y1="230" x2="1140" y2="200" stroke="{{moss}}" stroke-width="2.5"/>
  <line x1="960" y1="360" x2="1140" y2="330" stroke="{{moss}}" stroke-width="3"/>
  <line x1="960" y1="490" x2="1140" y2="460" stroke="{{ink}}" stroke-width="2"/>
  <circle cx="770" cy="360" r="9" fill="{{ink}}"/>
  <circle cx="960" cy="230" r="8" fill="{{moss}}"/>
  <circle cx="960" cy="360" r="8" fill="{{moss}}"/>
  <circle cx="960" cy="490" r="8" fill="{{ink}}"/>
  <rect x="1140" y="160" width="260" height="340" fill="none" stroke="{{ink}}" stroke-width="2.5"/>
  <rect x="1170" y="190" width="200" height="90" fill="{{moss}}" fill-opacity="0.22" stroke="{{moss}}" stroke-width="2.5"/>
  <rect x="1170" y="310" width="200" height="160" fill="none" stroke="{{ink}}" stroke-width="1.5"/>
  <line x1="770" y1="360" x2="860" y2="640" stroke="{{ink}}" stroke-width="2" stroke-dasharray="8,6"/>
  <line x1="860" y1="640" x2="1080" y2="640" stroke="{{ink}}" stroke-width="2" stroke-dasharray="8,6"/>
  <line x1="1095" y1="600" x2="1095" y2="680" stroke="{{ink}}" stroke-width="3"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.05"/>
</svg>
