<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
  <title>Mixture of Experts Sparse Top-2 Routing Across Dormant Memory Blocks</title>
  <desc>A left plum router node connects to a central vertical stack of eight expert rectangles; only the second and sixth rectangles are highlighted in plum and route forward to the right output node, while the other six rectangles sit dormant in ink.</desc>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="{{paper}}"/>
  <g stroke="{{border}}" stroke-width="1" opacity="0.55">
    <line x1="160" y1="150" x2="1440" y2="150"/>
    <line x1="160" y1="450" x2="1440" y2="450"/>
    <line x1="160" y1="750" x2="1440" y2="750"/>
    <line x1="340" y1="100" x2="340" y2="800" stroke-dasharray="5 5"/>
    <line x1="800" y1="100" x2="800" y2="800" stroke-dasharray="5 5"/>
    <line x1="1260" y1="100" x2="1260" y2="800" stroke-dasharray="5 5"/>
  </g>
  <g stroke="{{ink}}" stroke-width="1.2" opacity="0.35" fill="none">
    <line x1="340" y1="450" x2="680" y2="145"/>
    <line x1="340" y1="450" x2="680" y2="315"/>
    <line x1="340" y1="450" x2="680" y2="400"/>
    <line x1="340" y1="450" x2="695" y2="485" stroke-dasharray="4 4"/>
    <line x1="340" y1="450" x2="680" y2="655"/>
    <line x1="340" y1="450" x2="680" y2="740"/>
  </g>
  <g stroke="{{ink}}" stroke-width="1.8" opacity="0.5" fill="none">
    <rect x="680" y="115" width="240" height="58"/>
    <rect x="680" y="285" width="240" height="58"/>
    <rect x="680" y="370" width="240" height="58"/>
    <rect x="698" y="455" width="240" height="58" stroke-dasharray="6 5"/>
    <rect x="680" y="625" width="240" height="58"/>
    <rect x="680" y="710" width="240" height="58"/>
  </g>
  <g stroke="{{plum}}" stroke-width="3.5" fill="none">
    <line x1="160" y1="450" x2="318" y2="450"/>
    <circle cx="340" cy="450" r="22"/>
    <line x1="362" y1="450" x2="680" y2="230"/>
    <line x1="362" y1="450" x2="680" y2="570"/>
    <rect x="680" y="200" width="240" height="58"/>
    <rect x="680" y="540" width="240" height="58"/>
    <line x1="920" y1="230" x2="1238" y2="450"/>
    <line x1="920" y1="570" x2="1238" y2="450"/>
    <circle cx="1260" cy="450" r="22"/>
    <line x1="1282" y1="450" x2="1440" y2="450"/>
  </g>
  <g fill="{{plum}}">
    <circle cx="340" cy="450" r="6"/>
    <circle cx="800" cy="229" r="6"/>
    <circle cx="800" cy="569" r="6"/>
    <circle cx="1260" cy="450" r="6"/>
  </g>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.05"/>
</svg>
