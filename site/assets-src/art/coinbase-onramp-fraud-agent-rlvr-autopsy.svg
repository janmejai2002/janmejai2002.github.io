<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
  <title>Frontier model recall drift versus post-trained Qwen3.5-9B on Coinbase Onramp</title>
  <desc>Three tall frontier columns on the left fall below a horizontal recall threshold, with the third spiking high yet fracturing at the base, while a compact moss square on the right clears the line on a short latency bar.</desc>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="{{paper}}"/>
  <rect x="80" y="80" width="1440" height="740" fill="none" stroke="{{border}}" stroke-width="1.5"/>
  <line x1="120" y1="520" x2="1480" y2="520" stroke="{{ink}}" stroke-width="2" stroke-dasharray="10,8"/>
  <line x1="860" y1="80" x2="860" y2="820" stroke="{{border}}" stroke-width="1"/>
  <rect x="180" y="210" width="130" height="390" fill="none" stroke="{{ink}}" stroke-width="2"/>
  <line x1="180" y1="520" x2="310" y2="520" stroke="{{border}}" stroke-width="1.5"/>
  <rect x="380" y="240" width="130" height="440" fill="none" stroke="{{ink}}" stroke-width="2"/>
  <rect x="380" y="520" width="130" height="160" fill="{{ink}}" fill-opacity="0.06" stroke="none"/>
  <rect x="580" y="130" width="130" height="410" fill="none" stroke="{{ink}}" stroke-width="2"/>
  <line x1="580" y1="540" x2="645" y2="690" stroke="{{ink}}" stroke-width="2" stroke-dasharray="6,6"/>
  <line x1="710" y1="540" x2="645" y2="690" stroke="{{ink}}" stroke-width="2" stroke-dasharray="6,6"/>
  <rect x="980" y="310" width="190" height="190" fill="{{moss}}" fill-opacity="0.24" stroke="{{moss}}" stroke-width="3"/>
  <circle cx="1075" cy="405" r="42" fill="none" stroke="{{moss}}" stroke-width="2.5"/>
  <line x1="1230" y1="405" x2="1430" y2="405" stroke="{{moss}}" stroke-width="4"/>
  <circle cx="1430" cy="405" r="7" fill="{{moss}}"/>
  <line x1="980" y1="620" x2="1240" y2="620" stroke="{{moss}}" stroke-width="3.5"/>
  <line x1="980" y1="670" x2="1440" y2="670" stroke="{{border}}" stroke-width="2"/>
  <path d="M1075,500 L1075,565 L1290,565 L1290,460" fill="none" stroke="{{ink}}" stroke-width="1.5"/>
  <circle cx="1290" cy="460" r="5" fill="{{ink}}"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.05"/>
</svg>
