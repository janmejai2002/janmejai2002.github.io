<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
<title>Figma AI Canvas and MCP Context Overflow Diagram</title>
<desc>Geometric diagram of external MCP clients connecting to a six-frame visual canvas grid and a three-tier credit waterfall, with one fractured frame highlighted in moss green to mark a context overflow and unrefunded undo.</desc>
<defs>
<filter id="grain">
<feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
</filter>
</defs>
<rect width="1600" height="900" fill="{{paper}}"/>
<g stroke="{{border}}" stroke-width="1" fill="none">
<line x1="120" y1="120" x2="1480" y2="120"/>
<line x1="120" y1="780" x2="1480" y2="780"/>
<line x1="420" y1="120" x2="420" y2="780"/>
<line x1="1180" y1="120" x2="1180" y2="780"/>
</g>
<g stroke="{{ink}}" stroke-width="2" fill="none">
<rect x="160" y="210" width="160" height="80" rx="4"/>
<rect x="160" y="410" width="160" height="80" rx="4"/>
<rect x="160" y="610" width="160" height="80" rx="4"/>
<line x1="320" y1="250" x2="490" y2="330"/>
<line x1="320" y1="450" x2="490" y2="450"/>
<line x1="320" y1="650" x2="490" y2="570"/>
<circle cx="490" cy="330" r="5" fill="{{ink}}"/>
<circle cx="490" cy="450" r="5" fill="{{ink}}"/>
<circle cx="490" cy="570" r="5" fill="{{ink}}"/>
<rect x="520" y="210" width="180" height="190"/>
<rect x="740" y="210" width="180" height="190"/>
<rect x="520" y="460" width="180" height="190"/>
<rect x="740" y="460" width="180" height="190"/>
<rect x="960" y="460" width="180" height="190"/>
<line x1="700" y1="305" x2="740" y2="305"/>
<line x1="610" y1="400" x2="610" y2="460"/>
<line x1="830" y1="400" x2="830" y2="460"/>
<line x1="700" y1="555" x2="740" y2="555"/>
<line x1="920" y1="555" x2="960" y2="555"/>
</g>
<g stroke="{{moss}}" stroke-width="3" fill="none">
<rect x="978" y="192" width="180" height="190" stroke-dasharray="10 6"/>
<line x1="920" y1="305" x2="954" y2="305"/>
<line x1="964" y1="295" x2="972" y2="315"/>
<line x1="1050" y1="382" x2="1050" y2="430" stroke-dasharray="4 6"/>
<circle cx="1068" cy="287" r="24"/>
<line x1="1052" y1="271" x2="1084" y2="303"/>
</g>
<g stroke="{{ink}}" stroke-width="2" fill="none">
<rect x="1250" y="210" width="170" height="120"/>
<rect x="1250" y="370" width="170" height="120"/>
<rect x="1250" y="530" width="170" height="120"/>
<line x1="1270" y1="270" x2="1400" y2="270"/>
<line x1="1270" y1="430" x2="1360" y2="430"/>
<line x1="1270" y1="590" x2="1310" y2="590"/>
<line x1="1140" y1="555" x2="1250" y2="555" stroke="{{border}}" stroke-width="1.5"/>
</g>
<rect width="1600" height="900" filter="url(#grain)" opacity="0.05"/>
</svg>
