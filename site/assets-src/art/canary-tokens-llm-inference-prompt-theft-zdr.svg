<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
  <title>Canary Tokens Detecting Downstream Inference Leaks</title>
  <desc>Geometric diagram of an API router splitting into four downstream inference channels where three mizu tap lines siphon prompts to off-rail nodes.</desc>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="{{paper}}"/>
  <rect x="120" y="100" width="1360" height="700" fill="none" stroke="{{border}}" stroke-width="1"/>
  <line x1="180" y1="450" x2="440" y2="450" stroke="{{ink}}" stroke-width="3"/>
  <rect x="440" y="250" width="180" height="400" fill="none" stroke="{{ink}}" stroke-width="2.5"/>
  <path d="M620,290H1360M620,395H1360M620,505H1360M620,610H1360" stroke="{{ink}}" stroke-width="2"/>
  <line x1="860" y1="290" x2="860" y2="720" stroke="{{mizu}}" stroke-width="3" stroke-dasharray="8,6"/>
  <line x1="1020" y1="505" x2="1020" y2="720" stroke="{{mizu}}" stroke-width="3" stroke-dasharray="8,6"/>
  <line x1="1180" y1="610" x2="1180" y2="720" stroke="{{mizu}}" stroke-width="3" stroke-dasharray="8,6"/>
  <circle cx="860" cy="290" r="7" fill="{{mizu}}"/>
  <circle cx="1020" cy="505" r="7" fill="{{mizu}}"/>
  <circle cx="1180" cy="610" r="7" fill="{{mizu}}"/>
  <circle cx="860" cy="720" r="10" fill="none" stroke="{{mizu}}" stroke-width="3"/>
  <circle cx="1020" cy="720" r="10" fill="none" stroke="{{mizu}}" stroke-width="3"/>
  <circle cx="1180" cy="720" r="10" fill="none" stroke="{{mizu}}" stroke-width="3"/>
  <circle cx="1360" cy="395" r="7" fill="{{ink}}"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.055"/>
</svg>
