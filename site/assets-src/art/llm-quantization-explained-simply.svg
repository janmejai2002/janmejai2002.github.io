<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
  <title>16-Bit Fine Weight Continuum Compressed into 4-Bit K-Quant Buckets</title>
  <desc>A wide left rectangle holding 16 fine vertical ticks projects rightward via converging lines into a narrow plum rectangle one-quarter the width holding four bold vertical bars, with the third plum bar rising above the frame to depict 6-bit mixed precision.</desc>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="{{paper}}"/>
  <g stroke="{{border}}" stroke-width="1" opacity="0.55">
    <line x1="120" y1="200" x2="1480" y2="200"/>
    <line x1="120" y1="450" x2="1480" y2="450"/>
    <line x1="120" y1="700" x2="1480" y2="700"/>
    <line x1="880" y1="100" x2="880" y2="800" stroke-dasharray="6 6"/>
  </g>
  <rect x="180" y="200" width="560" height="500" fill="none" stroke="{{ink}}" stroke-width="2.5"/>
  <g stroke="{{ink}}" stroke-width="1.3" opacity="0.65">
    <line x1="212" y1="240" x2="212" y2="660"/>
    <line x1="245" y1="240" x2="245" y2="660"/>
    <line x1="278" y1="240" x2="278" y2="660"/>
    <line x1="311" y1="240" x2="311" y2="660"/>
    <line x1="344" y1="240" x2="344" y2="660"/>
    <line x1="377" y1="240" x2="377" y2="660"/>
    <line x1="410" y1="240" x2="410" y2="660"/>
    <line x1="443" y1="240" x2="443" y2="660"/>
    <line x1="476" y1="240" x2="476" y2="660"/>
    <line x1="509" y1="240" x2="509" y2="660"/>
    <line x1="542" y1="240" x2="542" y2="660"/>
    <line x1="575" y1="240" x2="575" y2="660"/>
    <line x1="608" y1="240" x2="608" y2="660"/>
    <line x1="641" y1="240" x2="641" y2="660"/>
    <line x1="674" y1="240" x2="674" y2="660"/>
    <line x1="707" y1="240" x2="707" y2="660"/>
  </g>
  <g stroke="{{ink}}" stroke-width="1.2" opacity="0.4" fill="none">
    <line x1="740" y1="200" x2="1120" y2="280"/>
    <line x1="740" y1="360" x2="1120" y2="390"/>
    <line x1="740" y1="540" x2="1120" y2="510"/>
    <line x1="740" y1="700" x2="1120" y2="620"/>
  </g>
  <rect x="1120" y="280" width="160" height="340" fill="none" stroke="{{plum}}" stroke-width="3"/>
  <g stroke="{{plum}}" stroke-width="4">
    <line x1="1152" y1="320" x2="1152" y2="580"/>
    <line x1="1184" y1="320" x2="1184" y2="580"/>
    <line x1="1216" y1="215" x2="1216" y2="580"/>
    <line x1="1248" y1="320" x2="1248" y2="580"/>
  </g>
  <circle cx="1216" cy="215" r="6" fill="{{plum}}"/>
  <rect x="1300" y="280" width="120" height="340" fill="none" stroke="{{border}}" stroke-width="1.5" stroke-dasharray="5 5"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.05"/>
</svg>
