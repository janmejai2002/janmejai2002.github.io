<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
  <title>AI Coding Dependency Stream Bypassing Policy Gate into Five Separate Remediation Budgets</title>
  <desc>A left-hand input block sends a horizontal line toward a suspended vertical policy gate at x=520: while the upper ink line is stopped, a lower ochre line passes beneath the open gate and branches into five stacked rectangular budget blocks on the right.</desc>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="{{paper}}"/>
  <g stroke="{{border}}" stroke-width="1" opacity="0.55">
    <line x1="120" y1="160" x2="1480" y2="160"/>
    <line x1="120" y1="305" x2="1480" y2="305"/>
    <line x1="120" y1="450" x2="1480" y2="450"/>
    <line x1="120" y1="595" x2="1480" y2="595"/>
    <line x1="120" y1="740" x2="1480" y2="740"/>
    <line x1="520" y1="90" x2="520" y2="810" stroke-dasharray="6 6"/>
    <line x1="1140" y1="90" x2="1140" y2="810"/>
  </g>
  <g stroke="{{ink}}" stroke-width="2.2" fill="none">
    <rect x="160" y="340" width="220" height="220"/>
    <line x1="380" y1="390" x2="520" y2="390"/>
    <line x1="520" y1="120" x2="520" y2="440" stroke-width="3.5"/>
    <rect x="1140" y="120" width="280" height="80"/>
    <rect x="1140" y="265" width="280" height="80"/>
    <rect x="1140" y="410" width="280" height="80"/>
    <rect x="1140" y="555" width="280" height="80"/>
    <rect x="1140" y="700" width="280" height="80"/>
  </g>
  <g stroke="{{ochre}}" stroke-width="3.2" fill="none">
    <line x1="380" y1="510" x2="680" y2="510"/>
    <path d="M 680 510 C 840 510, 940 160, 1140 160"/>
    <path d="M 680 510 C 840 510, 940 305, 1140 305"/>
    <path d="M 680 510 C 840 510, 940 450, 1140 450"/>
    <path d="M 680 510 C 840 510, 940 595, 1140 595"/>
    <path d="M 680 510 C 840 510, 940 740, 1140 740"/>
    <rect x="502" y="492" width="36" height="36" stroke-dasharray="4 4"/>
  </g>
  <g fill="{{ink}}">
    <circle cx="380" cy="390" r="5"/>
    <circle cx="520" cy="390" r="6"/>
  </g>
  <g fill="{{ochre}}">
    <circle cx="380" cy="510" r="6"/>
    <circle cx="680" cy="510" r="7"/>
    <circle cx="1140" cy="160" r="6"/>
    <circle cx="1140" cy="305" r="6"/>
    <circle cx="1140" cy="450" r="6"/>
    <circle cx="1140" cy="595" r="6"/>
    <circle cx="1140" cy="740" r="6"/>
  </g>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.05"/>
</svg>
