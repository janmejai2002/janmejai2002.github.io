<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
  <title>A block of ruled lines with one line broken, and a ring drawn around the break</title>
  <desc>Twelve horizontal rules are stacked like lines of text in a column. One rule in the middle is interrupted by a gap. A thin circle is drawn around that gap, marking it.</desc>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
  </filter>
  <rect width="1600" height="900" fill="{{paper}}"/>

  <line x1="452" y1="196" x2="452" y2="704" stroke="{{border}}" stroke-width="2"/>

  <g stroke="{{ink}}" stroke-width="9" stroke-linecap="butt" opacity="0.38">
    <line x1="508" y1="220" x2="1092" y2="220"/>
    <line x1="508" y1="262" x2="1148" y2="262"/>
    <line x1="508" y1="304" x2="1016" y2="304"/>
    <line x1="508" y1="346" x2="1120" y2="346"/>
    <line x1="508" y1="388" x2="1056" y2="388"/>
    <line x1="508" y1="472" x2="1104" y2="472"/>
    <line x1="508" y1="514" x2="1004" y2="514"/>
    <line x1="508" y1="556" x2="1136" y2="556"/>
    <line x1="508" y1="598" x2="1048" y2="598"/>
    <line x1="508" y1="640" x2="964" y2="640"/>
  </g>

  <g stroke="{{ink}}" stroke-width="9" stroke-linecap="butt" opacity="0.38">
    <line x1="508" y1="430" x2="742" y2="430"/>
    <line x1="898" y1="430" x2="1080" y2="430"/>
  </g>

  <circle cx="820" cy="430" r="80" fill="none" stroke="{{hanko}}" stroke-width="6"/>

  <rect width="1600" height="900" filter="url(#grain)" opacity="0.055"/>
</svg>
