<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
  <title>GitLab AI Gateway Boundary</title>
  <desc>Minimalist geometric diagram of a central AI gateway boundary fractured by an offset template block in moss green.</desc>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="{{paper}}"/>
  <path d="M100,100h1400v700h-1400zM100,450h1400M520,100v700M1080,100v700" fill="none" stroke="{{border}}" stroke-width="1"/>
  <circle cx="310" cy="450" r="90" fill="none" stroke="{{ink}}" stroke-width="2"/>
  <line x1="400" y1="450" x2="680" y2="450" stroke="{{ink}}" stroke-width="2"/>
  <rect x="680" y="250" width="240" height="400" fill="none" stroke="{{ink}}" stroke-width="2"/>
  <rect x="720" y="290" width="160" height="140" fill="{{ink}}" fill-opacity="0.06" stroke="{{border}}" stroke-width="1.5"/>
  <rect x="760" y="460" width="200" height="130" fill="{{moss}}" fill-opacity="0.22" stroke="{{moss}}" stroke-width="2.5"/>
  <line x1="960" y1="525" x2="1080" y2="525" stroke="{{moss}}" stroke-width="2" stroke-dasharray="6,6"/>
  <path d="M920,360h220l120,-90h110M1140,360l120,90h110" fill="none" stroke="{{ink}}" stroke-width="2"/>
  <circle cx="1370" cy="270" r="24" fill="none" stroke="{{ink}}" stroke-width="2"/>
  <circle cx="1370" cy="450" r="14" fill="none" stroke="{{ink}}" stroke-width="2"/>
  <path d="M680,710h240M700,700v20M740,700v20M780,700v20M820,700v20M860,700v20M900,700v20" stroke="{{border}}" stroke-width="1.5"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.05"/>
</svg>
