<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
<title>Agent Harness Memory Tiers Schematic</title>
<desc>Minimalist geometric blueprint showing L1, L2, and L3 memory strata connected to a central orchestrator ring and a severed budget gate marked with a cinnabar seal.</desc>
<defs>
<filter id="grain" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
</filter>
</defs>
<rect width="1600" height="900" fill="{{paper}}"/>
<rect x="100" y="100" width="1400" height="700" fill="none" stroke="{{border}}" stroke-width="1"/>
<rect x="200" y="180" width="460" height="110" fill="none" stroke="{{ink}}" stroke-width="2"/>
<rect x="200" y="395" width="460" height="110" fill="none" stroke="{{ink}}" stroke-width="2"/>
<rect x="200" y="610" width="460" height="110" fill="none" stroke="{{ink}}" stroke-width="2"/>
<line x1="430" y1="290" x2="430" y2="395" stroke="{{border}}" stroke-width="1.5" stroke-dasharray="4,6"/>
<line x1="430" y1="505" x2="430" y2="610" stroke="{{border}}" stroke-width="1.5" stroke-dasharray="4,6"/>
<line x1="660" y1="235" x2="960" y2="390" stroke="{{ink}}" stroke-width="1.5"/>
<line x1="660" y1="450" x2="930" y2="450" stroke="{{ink}}" stroke-width="2"/>
<line x1="660" y1="665" x2="960" y2="510" stroke="{{ink}}" stroke-width="1.5"/>
<circle cx="1050" cy="450" r="120" fill="{{paper}}" stroke="{{ink}}" stroke-width="2"/>
<circle cx="1050" cy="450" r="42" fill="none" stroke="{{ink}}" stroke-width="2.5"/>
<rect x="1260" y="350" width="160" height="200" fill="none" stroke="{{border}}" stroke-width="1.5"/>
<line x1="1170" y1="450" x2="1260" y2="450" stroke="{{ink}}" stroke-width="1.5"/>
<line x1="820" y1="160" x2="820" y2="375" stroke="{{hanko}}" stroke-width="3"/>
<line x1="820" y1="485" x2="820" y2="740" stroke="{{hanko}}" stroke-width="3"/>
<rect x="798" y="408" width="44" height="44" fill="none" stroke="{{hanko}}" stroke-width="3"/>
<circle cx="820" cy="430" r="7" fill="{{hanko}}"/>
<rect width="1600" height="900" filter="url(#grain)" opacity="0.05"/>
</svg>
