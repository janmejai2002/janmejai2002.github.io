<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
  <title>Claude Code Loading CLAUDE.md While Skipping Unimported Sibling AGENTS.md</title>
  <desc>Two stacked rectangular document blocks on the left represent CLAUDE.md and AGENTS.md: the top block connects cleanly via a bold mizu line into the right-hand initialization circle, while the bottom block's mizu line terminates at a severed gap before reaching the gate.</desc>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="{{paper}}"/>
  <g stroke="{{border}}" stroke-width="1" opacity="0.55">
    <line x1="140" y1="240" x2="1460" y2="240"/>
    <line x1="140" y1="450" x2="1460" y2="450"/>
    <line x1="140" y1="660" x2="1460" y2="660"/>
    <line x1="560" y1="100" x2="560" y2="800"/>
    <line x1="940" y1="100" x2="940" y2="800" stroke-dasharray="6 6"/>
    <line x1="1260" y1="100" x2="1260" y2="800"/>
  </g>
  <g stroke="{{ink}}" stroke-width="2.2" fill="none">
    <rect x="220" y="140" width="340" height="200"/>
    <line x1="260" y1="190" x2="500" y2="190" opacity="0.5"/>
    <line x1="260" y1="240" x2="480" y2="240" opacity="0.5"/>
    <line x1="260" y1="290" x2="510" y2="290" opacity="0.5"/>
    <rect x="220" y="560" width="340" height="200"/>
    <line x1="260" y1="610" x2="500" y2="610" opacity="0.5"/>
    <line x1="260" y1="660" x2="470" y2="660" opacity="0.5"/>
    <line x1="260" y1="710" x2="520" y2="710" opacity="0.5"/>
    <circle cx="1260" cy="450" r="95"/>
  </g>
  <g stroke="{{mizu}}" stroke-width="3.5" fill="none">
    <path d="M 560 240 C 780 240, 960 450, 1165 450"/>
    <line x1="390" y1="560" x2="390" y2="340" stroke-dasharray="5 6"/>
    <line x1="560" y1="660" x2="850" y2="660"/>
    <line x1="850" y1="635" x2="850" y2="685"/>
    <line x1="940" y1="660" x2="1165" y2="485" stroke-dasharray="4 8" opacity="0.45"/>
  </g>
  <g fill="{{mizu}}">
    <circle cx="560" cy="240" r="6"/>
    <circle cx="560" cy="660" r="6"/>
    <circle cx="850" cy="660" r="6"/>
    <circle cx="1165" cy="450" r="7"/>
    <circle cx="1260" cy="450" r="8"/>
  </g>
  <rect x="372" y="432" width="36" height="36" fill="none" stroke="{{mizu}}" stroke-width="2"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.05"/>
</svg>
