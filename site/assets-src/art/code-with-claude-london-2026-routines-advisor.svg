<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
<title>Advisor Pattern and MCP Tunnel Architecture</title>
<desc>Minimalist geometric blueprint depicting an executor loop, an upper advisor ring, a pierced firewall line, and a broken cache boundary marked with a cinnabar seal.</desc>
<defs>
<filter id="grain" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
</filter>
</defs>
<rect width="1600" height="900" fill="{{paper}}"/>
<rect x="100" y="100" width="1400" height="700" fill="none" stroke="{{border}}" stroke-width="1"/>
<circle cx="420" cy="270" r="95" fill="none" stroke="{{ink}}" stroke-width="2"/>
<circle cx="420" cy="270" r="32" fill="none" stroke="{{ink}}" stroke-width="2.5"/>
<rect x="240" y="520" width="360" height="140" fill="none" stroke="{{ink}}" stroke-width="2"/>
<line x1="420" y1="365" x2="420" y2="520" stroke="{{ink}}" stroke-width="2"/>
<line x1="820" y1="150" x2="820" y2="750" stroke="{{border}}" stroke-width="1.5" stroke-dasharray="6,8"/>
<line x1="600" y1="560" x2="1120" y2="560" stroke="{{ink}}" stroke-width="2"/>
<line x1="600" y1="620" x2="1120" y2="620" stroke="{{ink}}" stroke-width="2"/>
<rect x="1120" y="490" width="240" height="200" fill="none" stroke="{{ink}}" stroke-width="2"/>
<rect x="1160" y="530" width="160" height="120" fill="none" stroke="{{border}}" stroke-width="1"/>
<line x1="660" y1="180" x2="660" y2="395" stroke="{{hanko}}" stroke-width="3"/>
<line x1="660" y1="485" x2="660" y2="720" stroke="{{hanko}}" stroke-width="3"/>
<rect x="638" y="418" width="44" height="44" fill="none" stroke="{{hanko}}" stroke-width="3"/>
<circle cx="660" cy="440" r="7" fill="{{hanko}}"/>
<rect width="1600" height="900" filter="url(#grain)" opacity="0.05"/>
</svg>
