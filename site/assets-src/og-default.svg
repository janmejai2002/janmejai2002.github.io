<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Site-wide social card. Rasterised by scripts/make-images.mjs.
       Font stack is deliberately system-first: this renders through resvg at
       build time, which has no access to the webfont the site itself loads. -->
  <rect width="1200" height="630" fill="#F6F4EF"/>
  <rect x="0" y="0" width="14" height="630" fill="#D2543F"/>

  <g opacity="0.13" transform="translate(925 300) scale(10)">
    <path d="M21.5 6.47 A11 11 0 1 1 10.5 6.47" transform="translate(-16 -16)"
          fill="none" stroke="#1A2639" stroke-width="3.4" stroke-linecap="round"/>
  </g>

  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" fill="#1A2639">
    <text x="90" y="196" font-size="26" font-weight="700" letter-spacing="5"
          fill="#00A9B8">WABI SABI</text>
    <text x="90" y="300" font-size="76" font-weight="800" letter-spacing="-2">Applied AI, written</text>
    <text x="90" y="384" font-size="76" font-weight="800" letter-spacing="-2">while it is still wrong.</text>
    <text x="90" y="470" font-size="27" font-weight="400" fill="#5A6474">Notes on building AI systems that are never finished.</text>
    <text x="90" y="560" font-size="23" font-weight="600" fill="#1A2639">Janmejai Singh Minhas</text>
    <text x="352" y="560" font-size="23" font-weight="400" fill="#8A93A1">Machine Learning Engineer</text>
  </g>
</svg>
