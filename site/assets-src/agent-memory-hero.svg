<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <!-- Hero for "Your Agent's Memory Might Just Want to Be a Filesystem".
       Rasterised by scripts/make-images.mjs into src/assets/. Two columns:
       an embedding cloud on the left, a directory of files on the right,
       each carrying the accuracy the paper reports for it. -->
  <rect width="1600" height="900" fill="#F6F4EF"/>

  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">

    <!-- left: retrieval -->
    <g>
      <text x="140" y="150" font-size="24" font-weight="700" letter-spacing="4" fill="#8A6690">RETRIEVAL</text>
      <g fill="#8A6690" opacity="0.55">
        <circle cx="212" cy="292" r="9"/><circle cx="286" cy="248" r="6"/><circle cx="352" cy="316" r="11"/>
        <circle cx="176" cy="372" r="6"/><circle cx="268" cy="404" r="13"/><circle cx="404" cy="252" r="7"/>
        <circle cx="452" cy="356" r="9"/><circle cx="330" cy="432" r="6"/><circle cx="208" cy="470" r="10"/>
        <circle cx="392" cy="486" r="7"/><circle cx="486" cy="440" r="6"/><circle cx="150" cy="240" r="7"/>
        <circle cx="472" cy="286" r="10"/><circle cx="300" cy="360" r="7"/><circle cx="360" cy="196" r="6"/>
        <circle cx="248" cy="212" r="5"/><circle cx="430" cy="404" r="5"/><circle cx="166" cy="430" r="5"/>
        <circle cx="512" cy="352" r="7"/><circle cx="286" cy="500" r="9"/>
      </g>
      <text x="140" y="668" font-size="118" font-weight="800" letter-spacing="-4" fill="#1A2639">48.5%</text>
      <text x="140" y="722" font-size="25" fill="#5A6474">best pure-retrieval baseline</text>
      <text x="140" y="766" font-size="25" fill="#5A6474">0.2 seconds a query</text>
    </g>

    <!-- divider -->
    <rect x="790" y="150" width="2" height="620" fill="#DCD4C7"/>

    <!-- right: the files -->
    <g>
      <text x="880" y="150" font-size="24" font-weight="700" letter-spacing="4" fill="#00A9B8">THE FILES</text>
      <g fill="none" stroke="#1A2639" stroke-width="3" opacity="0.72">
        <rect x="880" y="200" width="150" height="106" rx="10"/>
        <rect x="1056" y="200" width="150" height="106" rx="10"/>
        <rect x="1232" y="200" width="150" height="106" rx="10"/>
        <rect x="880" y="332" width="150" height="106" rx="10"/>
        <rect x="1056" y="332" width="150" height="106" rx="10"/>
        <rect x="1232" y="332" width="150" height="106" rx="10"/>
        <rect x="880" y="464" width="150" height="106" rx="10"/>
        <rect x="1056" y="464" width="150" height="106" rx="10"/>
        <rect x="1232" y="464" width="150" height="106" rx="10"/>
      </g>
      <g fill="#1A2639" opacity="0.28">
        <rect x="902" y="228" width="82" height="7" rx="3.5"/><rect x="902" y="248" width="60" height="7" rx="3.5"/>
        <rect x="1078" y="228" width="70" height="7" rx="3.5"/><rect x="1078" y="248" width="94" height="7" rx="3.5"/>
        <rect x="1254" y="228" width="90" height="7" rx="3.5"/><rect x="1254" y="248" width="52" height="7" rx="3.5"/>
        <rect x="902" y="360" width="66" height="7" rx="3.5"/><rect x="902" y="380" width="88" height="7" rx="3.5"/>
        <rect x="1078" y="360" width="96" height="7" rx="3.5"/><rect x="1078" y="380" width="58" height="7" rx="3.5"/>
        <rect x="1254" y="360" width="74" height="7" rx="3.5"/><rect x="1254" y="380" width="80" height="7" rx="3.5"/>
        <rect x="902" y="492" width="86" height="7" rx="3.5"/><rect x="902" y="512" width="62" height="7" rx="3.5"/>
        <rect x="1078" y="492" width="56" height="7" rx="3.5"/><rect x="1078" y="512" width="92" height="7" rx="3.5"/>
        <rect x="1254" y="492" width="88" height="7" rx="3.5"/><rect x="1254" y="512" width="66" height="7" rx="3.5"/>
      </g>
      <text x="880" y="668" font-size="118" font-weight="800" letter-spacing="-4" fill="#1A2639">69.3%</text>
      <text x="880" y="722" font-size="25" fill="#5A6474">off-the-shelf coding agent, same files</text>
      <text x="880" y="766" font-size="25" fill="#5A6474">about three minutes a query</text>
    </g>

    <text x="140" y="846" font-size="22" fill="#8A93A1">LongMemEval-V2, UCLA, May 2026 · averages across the Small and Medium tiers</text>
  </g>
</svg>
