<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="wAIbi-sabi">
  <!-- The kintsugi plate: a square vessel broken by one fracture and mended
       in gold — corrections made in public, the repair left visible. The
       crack is the one deliberate imperfection. Dark-tab colours ride along
       inside the file; rasterisers resolve the light branch. -->
  <style>
    .plate { stroke: #1A2639; }
    .gold { stroke: #B8862F; }
    @media (prefers-color-scheme: dark) {
      .plate { stroke: #E9E5DC; }
      .gold { stroke: #DDB667; }
    }
  </style>
  <rect class="plate" x="4" y="4" width="24" height="24" fill="none" stroke-width="2.4"/>
  <polyline class="gold" points="17,4 14,10 18,15 13,21 16,28" fill="none" stroke-width="2.6"/>
</svg>
