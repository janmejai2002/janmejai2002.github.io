<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="wAIbi-sabi">
  <!-- The ensō: one brush stroke, deliberately left open — the site's whole
       argument in 32 pixels. Inside the unclosed circle sits "AI", drawn as
       strokes rather than set in a font so it renders identically everywhere.
       At 16px the letters read as two marks; at 32px they read as AI. The
       opening in the circle stays the one deliberate imperfection. -->
  <path d="M21.5 6.47 A11 11 0 1 1 10.5 6.47"
        fill="none" stroke="#D2543F" stroke-width="3.6" stroke-linecap="round" />
  <g fill="none" stroke="#D2543F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10.8 20.8 L13.6 11.8 L16.4 20.8" />
    <path d="M12 17.9 L15.2 17.9" />
    <path d="M20.8 11.8 L20.8 20.8" />
  </g>
</svg>
